<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Síndico · Carvalho &amp; Abreu</title>
<meta name="description" content="Portal da Carvalho & Abreu Sindicância Profissional.">
<meta name="theme-color" content="#0F2646">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Síndico">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0F2646; --azul2:#16325C; --ouro:#C9A46A; --ouro-claro:#E3C894; --ouro-fundo:#F3E6CC;
  --creme:#F8F4EC; --creme2:#F1EBDD; --linha:#E2DACA; --linha2:#ECE5D6;
  --texto:#1E2B45; --suave:#5C6680; --suave2:#3D4863; --vinho:#8A2E2E; --vinho-fundo:#F6E9E6;
  --sombra:0 1px 6px rgba(15,38,70,.05); --sombra-alta:0 12px 36px rgba(15,38,70,.22);
  --topo-seg:env(safe-area-inset-top,0px); --baixo-seg:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--texto);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.serif{font-family:Lora,Georgia,serif}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}

/* ---------- Entrada ---------- */
#entrada{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--topo-seg)) 20px calc(24px + var(--baixo-seg))}
.entrada-caixa{width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:var(--sombra-alta);overflow:hidden;text-align:center}
.entrada-topo{background:var(--azul);padding:28px 24px 22px;border-bottom:3px solid var(--ouro)}
.entrada-topo img{width:88px;height:88px;border-radius:50%;background:#fff;border:3px solid var(--ouro)}
.entrada-topo h1{margin:12px 0 2px;color:#fff;font-size:1.75rem}
.entrada-topo p{margin:0;color:var(--ouro-claro);font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.entrada-corpo{padding:26px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.entrada-corpo p{margin:0;color:var(--suave);font-size:.95rem}
#botaoGoogle{min-height:44px;display:flex;justify-content:center}
.entrada-msg{font-size:.9rem;color:var(--vinho);background:var(--vinho-fundo);border-radius:10px;padding:10px 12px;width:100%}
.entrada-rodape{padding:0 24px 18px;font-size:.8rem}
.entrada-rodape a{color:var(--suave)}

/* ---------- Casca ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topo{background:#fff;border-bottom:1px solid var(--linha2);padding:calc(.75em + var(--topo-seg)) 1.75em .75em;display:flex;align-items:center;gap:1.25em;position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:.75em;flex:1 1 auto;min-width:0}
.marca img{width:2.5em;height:2.5em;border-radius:50%;border:2px solid var(--ouro);background:#fff;flex:none}
.marca-nomes{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;min-width:0}
.marca-nome{font-family:Lora,Georgia,serif;font-weight:700;font-size:1.375em;color:var(--azul);line-height:1.1}
.marca-sub{font-size:.75em;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#6B5A3A}
.telas{display:flex;align-items:center;gap:.5em}
.telas span{font-size:.8125em;color:var(--suave)}
.telas-grupo{display:flex;background:var(--creme2);border-radius:.75em;padding:.25em;gap:.25em}
.telas-grupo button{min-height:2.25em;padding:0 .8em;border-radius:.55em;border:none;background:transparent;color:var(--suave2);font-size:.8125em;font-weight:600}
.telas-grupo button[aria-pressed="true"]{background:var(--azul);color:#fff}
.icone-bt{position:relative;width:2.75em;height:2.75em;border-radius:50%;border:1px solid var(--linha);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.selo{position:absolute;top:-.2em;right:-.2em;min-width:1.25em;height:1.25em;border-radius:999px;background:var(--vinho);color:#fff;font-size:.6875em;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .3em}
.perfil{display:flex;align-items:center;gap:.6em;background:none;border:none;padding:.25em;border-radius:999px;text-align:left}
.avatar{width:2.5em;height:2.5em;border-radius:50%;background:var(--creme2);color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.875em;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.perfil-txt{display:flex;flex-direction:column;line-height:1.25}
.perfil-txt b{font-size:.875em;font-weight:600;color:var(--azul)}
.perfil-txt small{font-size:.75em;color:var(--suave)}

.corpo{display:flex;flex:1;min-height:0}
.lateral{flex:none;width:15em;background:var(--azul);color:#fff;padding:1.5em .875em;display:flex;flex-direction:column;gap:.25em}
.lat-titulo{font-size:.6875em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro);padding:0 .9em .6em}
.lat-titulo.cinza{color:#8C99B3;padding-top:1.6em}
.lat-item{display:flex;align-items:center;gap:.75em;min-height:2.75em;padding:0 .9em;border-radius:.75em;color:#fff;text-decoration:none;font-weight:600;font-size:.9375em;background:none;border:none;width:100%;text-align:left}
.lat-item[aria-current="page"]{background:rgba(201,164,106,.18)}
.lat-item .cont{min-width:1.6em;height:1.6em;border-radius:999px;background:var(--ouro);color:var(--azul);font-size:.8em;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .4em}
.lat-breve{display:flex;align-items:center;gap:.75em;min-height:2.4em;padding:0 .9em;color:#A9B4C9;font-size:.9375em}
.lat-breve i{width:.5em;height:.5em;border-radius:50%;border:1.5px solid #6B7A99;flex:none}
.lat-esp{flex:1;min-height:1.5em}
.lat-rodape{font-size:.75em;color:#8C99B3;padding:.6em .9em 0}
.lat-rodape a{color:#A9B4C9}

.coluna-icones{display:none}
.principal{flex:1;min-width:0;padding:1.75em 2em 2.5em;display:flex;flex-direction:column;gap:1.25em}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:1em 1.5em}
.cab h1{margin:0;font-family:Lora,Georgia,serif;font-weight:700;font-size:1.75em;color:var(--azul)}
.abas{display:flex;gap:.25em;flex:1 1 auto}
.abas button{min-height:2.75em;padding:0 1em;border:none;background:none;border-bottom:3px solid transparent;color:var(--suave);font-weight:500;font-size:.9375em}
.abas button[aria-selected="true"]{border-bottom-color:var(--ouro);color:var(--azul);font-weight:700}
.bt{min-height:2.75em;padding:0 1.25em;border-radius:.75em;border:none;background:var(--azul);color:#fff;font-weight:600;font-size:.9375em;display:inline-flex;align-items:center;justify-content:center;gap:.5em}
.bt.claro{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.bt.ouro{background:#fff;color:var(--azul);border:1.5px solid var(--ouro)}
.bt.grande{min-height:3.25em;border-radius:.875em;font-weight:700;font-size:1em;width:100%}
.bt:disabled{opacity:.55;cursor:default}
.bt-link{background:none;border:none;padding:.4em 0;color:var(--azul);font-weight:600;font-size:.875em;text-decoration:underline;text-decoration-color:var(--ouro);text-underline-offset:3px}

.condos{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.chip{min-height:2.75em;display:inline-flex;align-items:center;gap:.5em;padding:0 .875em 0 1.1em;border-radius:999px;font-size:.9375em;font-weight:600;background:#fff;color:var(--azul);border:2px solid var(--linha);white-space:nowrap;flex:none}
.chip .n{min-width:1.5em;height:1.5em;padding:0 .4em;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:.8125em;font-weight:700;background:var(--creme2);color:var(--azul)}
.chip[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
.chip[aria-pressed="true"] .n{background:var(--ouro)}
.outros{min-height:2.75em;border-radius:999px;border:2px dashed var(--linha);background:#fff;color:var(--azul);font-weight:600;font-size:.9375em;padding:0 1em}

.area{display:flex;gap:1.5em;align-items:flex-start}
.lista{flex:1 1 24em;min-width:0;display:flex;flex-direction:column;gap:1.5em}
.secao{display:flex;flex-direction:column;gap:.6em}
.secao h2{margin:0;font-size:.8125em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.secao.urg h2{color:#7A5C27}
.secao.voce h2{color:var(--azul)}
.cartao{display:flex;align-items:center;gap:.875em;padding:.75em .875em .75em 1em;border-radius:1em;background:#fff;border:2px solid transparent;box-shadow:var(--sombra)}
.secao.urg .cartao{border-color:var(--ouro);box-shadow:none}
.secao.voce .cartao{border-color:var(--ouro-claro);box-shadow:none}
.cartao.sel{border-color:var(--azul)!important}
.secao.voce .cartao.sel{background:var(--ouro-fundo)}
.posicao{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--ouro);color:var(--azul);font-weight:700;font-size:.9375em;display:flex;align-items:center;justify-content:center}
.cartao-abrir{flex:1;min-width:0;min-height:2.75em;text-align:left;background:none;border:none;padding:0;display:flex;flex-direction:column;gap:.3em;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.compart{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.3em;width:2em;height:1.6em;margin:-.3em -.4em -.3em .05em;border-radius:.5em;color:#9AA3B5;cursor:pointer}
.compart:hover,.compart:active{color:var(--azul2);background:#EEF1F6}
.edit-tit{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.12em;width:1.5em;height:1.5em;margin-left:.15em;padding:0;border:none;border-radius:.4em;background:none;color:#9AA3B5;cursor:pointer}
.edit-tit svg{width:.72em;height:.72em}
.edit-tit:hover,.edit-tit:focus-visible{color:var(--azul2);background:#EEF1F6}
.det-topo{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.bt-compart{display:inline-flex;align-items:center;gap:.4em;margin-left:auto;min-height:2.75em;padding:0 .8em;border-radius:999px;border:1px solid var(--linha);background:#fff;color:var(--azul);font-weight:600;font-size:.9375em}
.bt-compart:hover{border-color:var(--ouro)}
.opc-lista{display:flex;flex-direction:column;gap:.25em}
.cartao-titulo{font-size:1.0625em;font-weight:500;line-height:1.3;color:var(--texto);overflow-wrap:anywhere}
.secao.urg .cartao-titulo,.secao.voce .cartao-titulo{font-weight:600;color:var(--azul)}
.cartao-meta{font-size:.8125em;color:var(--suave)}
.etiqueta{align-self:flex-start;font-size:.75em;font-weight:600;color:var(--vinho);background:var(--vinho-fundo);border-radius:999px;padding:.3em .7em}
.concluir{flex:none;width:2.75em;height:2.75em;border-radius:50%;border:2px solid #B8C0D0;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.concluir svg{stroke:#8A93A8}
.secao.urg .concluir{border:2.5px solid var(--azul)}
.secao.urg .concluir svg{stroke:var(--azul)}
.secao.voce .concluir{border:none;background:var(--ouro)}
.secao.voce .concluir svg{stroke:var(--azul)}
.vazio{margin:0;padding:1.25em;text-align:center;color:var(--suave);font-size:.9375em;background:#fff;border-radius:1em}
.carregando{padding:2.5em 1em;text-align:center;color:var(--suave)}

/* ---------- Tarefa aberta ---------- */
.detalhe{flex:1.3 1 28em;min-width:0;background:#fff;border-radius:1.25em;padding:1.75em;box-shadow:0 2px 14px rgba(15,38,70,.06);display:flex;flex-direction:column;gap:1.25em;position:sticky;top:6em;max-height:calc(100vh - 7.5em);overflow-y:auto}
.detalhe-vazio{margin:0;padding:3em 1em;text-align:center;color:var(--suave)}
.voltar{display:none}
.det-condo{font-size:.75em;font-weight:600;color:#6B7690;text-transform:uppercase;letter-spacing:.1em}
.det-titulo{margin:0;font-family:Lora,Georgia,serif;font-weight:700;font-size:1.5em;line-height:1.25;color:var(--azul);overflow-wrap:anywhere}
.pilulas{display:flex;flex-wrap:wrap;gap:.5em;padding-top:.25em}
.pilula{font-size:.8125em;color:var(--suave2);background:#EEF1F6;border-radius:999px;padding:.35em .8em}
.pilula.forte{font-weight:600;color:var(--azul)}
.pilula.urg{font-weight:700;color:var(--azul);background:var(--ouro-fundo)}
.pilula.atraso{font-weight:600;color:var(--vinho);background:var(--vinho-fundo)}
.caixa-creme{display:flex;flex-wrap:wrap;align-items:center;gap:.5em;padding:.75em 1em;background:var(--creme);border-radius:.875em}
.caixa-creme>span{font-size:.8125em;font-weight:600;color:var(--suave);flex:1 1 auto}
.seta{width:2.75em;height:2.75em;border-radius:.75em;border:1px solid var(--linha);background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.rotulo{font-size:.75em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.bloco{display:flex;flex-direction:column;gap:.5em}
.desc{margin:0;font-size:.9375em;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.campo{width:100%;min-height:2.75em;border:1px solid var(--linha);border-radius:.75em;padding:.6em 1em;font-size:.9375em;background:#fff;color:var(--texto)}
textarea.campo{resize:vertical;line-height:1.45}
select.campo{padding-right:2em}
.linha-campos{display:flex;gap:.5em;align-items:flex-end}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(12em,1fr));gap:.4em 1em}
.grade2>div{display:flex;flex-direction:column;gap:.4em;min-width:0}
.obs{display:flex;gap:.75em}
.obs .avatar{width:2.25em;height:2.25em;font-size:.75em}
.obs-caixa{flex:1;min-width:0;display:flex;flex-direction:column;gap:.25em;padding:.7em .9em;border-radius:.875em;background:var(--creme)}
.obs-autor{font-size:.8125em;font-weight:600;color:var(--azul)}
.obs-texto{font-size:.9375em;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.obs.excluida .obs-caixa{background:#FAFAF8;border:1px dashed var(--linha)}
.obs.excluida .obs-autor,.obs.excluida .obs-texto,.obs-aviso{color:#9AA3B5}
.obs.excluida .obs-texto{text-decoration:line-through}
.obs-aviso{font-size:.75em}
.obs-excluir{align-self:flex-start;background:none;border:none;padding:.2em 0;font-size:.75em;color:var(--vinho);text-decoration:underline}
.historico summary{cursor:pointer;font-size:.8125em;font-weight:600;color:var(--suave);min-height:2.25em;display:flex;align-items:center}
.historico ol{margin:.25em 0 0;padding-left:1.1em;font-size:.8125em;color:var(--suave2);display:flex;flex-direction:column;gap:.35em}

/* ---------- Avisos, menus, painéis ---------- */
.aviso{position:fixed;left:17em;bottom:1.5em;width:24em;max-width:calc(100% - 2em);background:var(--azul);color:#fff;border-radius:.875em;padding:.6em .6em .6em 1.1em;display:flex;align-items:center;justify-content:space-between;gap:.75em;box-shadow:0 6px 20px rgba(15,38,70,.25);z-index:60}
.aviso span{font-size:.9375em;font-weight:500}
.aviso button{min-height:2.75em;padding:0 1em;border-radius:.625em;border:none;background:var(--ouro);color:var(--azul);font-weight:700;font-size:.9375em}
.aviso.erro{background:var(--vinho)}
.menu{position:fixed;z-index:95;background:#fff;border:1px solid var(--linha2);border-radius:1em;box-shadow:var(--sombra-alta);padding:.5em;min-width:16em;max-width:calc(100vw - 1.5em)}
.menu-cab{padding:.6em .75em .7em;border-bottom:1px solid var(--linha2);margin-bottom:.35em}
.menu-cab b{display:block;color:var(--azul)}
.menu-cab small{color:var(--suave)}
.menu-item{display:flex;align-items:center;gap:.6em;width:100%;min-height:2.75em;padding:0 .75em;border:none;background:none;border-radius:.6em;text-align:left;font-size:.9375em;color:var(--texto);text-decoration:none}
.menu-item:hover{background:var(--creme)}
.menu-vazio{padding:1em .75em;color:var(--suave);font-size:.9375em}
body.janela-aberta .sugerir-flut{display:none}
.sugerir-flut{position:fixed;right:1.75em;bottom:1.5em;min-height:3.25em;padding:0 1.25em 0 1em;border-radius:999px;border:2px solid var(--ouro);background:var(--azul);color:#fff;font-weight:600;font-size:.9375em;display:flex;align-items:center;gap:.6em;box-shadow:0 6px 20px rgba(15,38,70,.25);z-index:30}
.fundo{position:fixed;inset:0;background:rgba(15,38,70,.35);z-index:80}
.janela{position:fixed;z-index:90;background:#fff;box-shadow:var(--sombra-alta);display:flex;flex-direction:column;overflow:hidden}
.janela.flutuante{right:1.75em;bottom:1.5em;width:24em;max-width:calc(100% - 2em);max-height:calc(100vh - 3em);border-radius:1.25em;border:1px solid var(--linha2)}
.janela.centro{left:50%;top:50%;transform:translate(-50%,-50%);width:34em;max-width:calc(100% - 2em);max-height:calc(100vh - 3em);border-radius:1.25em}
.jan-cab{background:var(--azul);color:#fff;padding:1em 1em 1em 1.25em;display:flex;align-items:center;gap:.75em;border-bottom:3px solid var(--ouro);flex:none}
.jan-cab div{flex:1;display:flex;flex-direction:column;gap:.15em;min-width:0}
.jan-cab b{font-family:Lora,Georgia,serif;font-size:1.0625em}
.jan-cab small{font-size:.75em;color:#C9D1E0}
.fechar{width:2.75em;height:2.75em;border-radius:50%;border:none;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.alca{display:none}
.jan-corpo{padding:1.1em 1.25em 1.25em;display:flex;flex-direction:column;gap:.9em;overflow-y:auto}
.jan-rodape{display:flex;align-items:center;justify-content:space-between;gap:.75em;flex-wrap:wrap}
.opcao{min-height:2.75em;padding:0 1em;border-radius:.75em;text-align:left;font-size:.9375em;font-weight:600;background:#fff;color:var(--azul);border:2px solid var(--linha);width:100%}
.opcao[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
.origem{display:flex;align-items:center;gap:.5em;font-size:.75em;color:var(--suave);background:var(--creme);border-radius:.6em;padding:.55em .75em}
.erro-txt{font-size:.8125em;color:var(--vinho)}
.rot-campo{font-size:.8125em;font-weight:600;color:var(--suave2)}
.chave{display:flex;align-items:center;gap:.75em;min-height:2.75em;background:none;border:none;padding:0;font-size:.9375em;color:var(--suave2);text-align:left}
.chave i{width:2.75em;height:1.6em;border-radius:999px;background:#D5D9E2;position:relative;flex:none;transition:background .15s}
.chave i::after{content:"";position:absolute;top:.2em;left:.2em;width:1.2em;height:1.2em;border-radius:50%;background:#fff;transition:left .15s}
.chave[aria-checked="true"] i{background:var(--azul)}
.chave[aria-checked="true"] i::after{left:1.35em}
.mic{width:2.75em;height:2.75em;border-radius:.75em;border:1.5px solid var(--ouro);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.mic.ouvindo{background:var(--vinho);border-color:var(--vinho)}
.mic.ouvindo svg{stroke:#fff}
.sug-item{border:1px solid var(--linha2);border-radius:.75em;padding:.7em .85em;display:flex;flex-direction:column;gap:.25em}
.sug-item small{color:var(--suave)}

    theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'pt-BR', width: 280
  });
  google.accounts.id.prompt();
}

function lerToken(token) {
  try {
    var b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    var json = decodeURIComponent(atob(b).split('').map(function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
    var d = JSON.parse(json);
    return { foto: d.picture || '', nome: d.name || '' };
  } catch (e) { return {}; }
}

function aoEntrarGoogle(resp) {
  $('entradaTexto').textContent = 'Entrando…';
  $('entradaMsg').hidden = true;
  var info = lerToken(resp.credential);
  chamar({ fn: 'entrar', token: resp.credential }).then(function (r) {
    if (!r.ok) { mostrarEntrada(r.mensagem || 'Acesso não autorizado.'); return; }
    S.sessao = r.sessao; S.google = info;
    guardar('sessao', r.sessao); guardar('google', JSON.stringify(info));
    S.portal = r; S.dados = r.tarefas || null;
    abrirApp();
  });
}

function sair(msg) {
  if (S.sessao) chamar({ fn: 'api', sessao: S.sessao, acao: 'portal.sair', dados: {} });
  S.sessao = null; S.dados = null; S.det = null; S.selId = null;
  guardar('sessao', null); guardar('google', null);
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  fecharCamadas();
  mostrarEntrada(msg || '');
}

/* ================= Casca ================= */
function aplicarTela() {
  var f = faixa();
  var tela = lerLocal('tela') || telaPadrao();
  var t = TELAS.filter(function (x) { return x.id === tela; })[0] || TELAS[0];
  document.documentElement.style.fontSize = f === 'computador' ? t.px + 'px' : f === 'tablet' ? '17px' : '';
  $('telas').innerHTML = TELAS.map(function (x) {
    return '<button data-tela="' + x.id + '" aria-pressed="' + (x.id === t.id) + '">' + x.rotulo + '</button>';
  }).join('');
}
function telaPadrao() {
  var p = String((S.portal && S.portal.app && S.portal.app.telaPadrao) || (S.cfg && S.cfg.telaPadrao) || 'Automático').toLowerCase();
  if (p.indexOf('1080') >= 0) return '1080';
  if (p.indexOf('1440') >= 0) return '1440';
  if (p.indexOf('4k') >= 0) return '4k';
  return 'auto';
}

function abrirApp() {
  $('entrada').hidden = true; $('app').hidden = false;
  var u = (S.portal && S.portal.usuario) || (S.dados && S.dados.usuario) || {};
  var app = (S.portal && S.portal.app) || {};
  var nome = faixa() === 'computador' ? (app.nomeLongo || 'Síndico') : (app.nomeCurto || 'Síndico');
  $('nomeApp').textContent = (nome.split('·')[0] || 'Síndico').trim();
  document.title = app.nomeLongo || 'Síndico · Carvalho & Abreu';
  $('perfilNome').textContent = u.nome || '';
  $('perfilPapel').textContent = papelTexto(u);
  var av = $('avatar');
  if (S.google && S.google.foto) av.innerHTML = '<img src="' + esc(S.google.foto) + '" alt="" referrerpolicy="no-referrer">';
  else av.textContent = iniciais(u.nome);
  $('emBreve').innerHTML = EM_BREVE.map(function (m) { return '<div class="lat-breve"><i aria-hidden="true"></i><span>' + esc(m) + '</span></div>'; }).join('');
  $('versaoLat').textContent = 'v' + VERSAO_SITE;
  aplicarTela();
  if (S.dados) desenhar(); else recarregar();
}
function papelTexto(u) {
  var p = String(u.perfil || '').toLowerCase();
  var nome = u.master ? 'Master' : p ? p.charAt(0).toUpperCase() + p.slice(1) : '';
  return nome + (u.empresa && !u.master ? ' · ' + u.empresa : '');
}

/* ================= Dados ================= */
var recarregando = false;
function recarregar() {
  if (recarregando || !S.sessao) return Promise.resolve();
  recarregando = true;
  var pPortal = S.portal ? Promise.resolve(S.portal) : api('portal.inicio');
  return Promise.all([pPortal, api('tarefas.inicio')]).then(function (rs) {
    recarregando = false;
    if (rs[0] && rs[0].ok) S.portal = rs[0];
    if (rs[1] && rs[1].ok) { S.dados = rs[1]; if ($('app').hidden) abrirApp(); else desenhar(); }
    else if (rs[1]) avisar(rs[1].mensagem, true);
  }).catch(function () { recarregando = false; });
}

/* ================= Lista ================= */
function desenhar() {
  if (!S.dados) return;
  var d = S.dados;
  var u = d.usuario || {};
  var podeCriar = (d.condos || []).some(function (c) { return c.podeCriar; });
  ['btNova', 'icNova', 'bbNova'].forEach(function (id) { $(id).hidden = !podeCriar; });
  $('contLateral').textContent = (d.tarefas || []).length;
  desenharSino();
  desenharCondos();
  desenharLista();
  if (S.selId && !S.det) abrirTarefa(S.selId, true);
  if (ler('abrirT')) abrirLinkDireto();
}

function desenharCondos() {
  var d = S.dados, condos = d.condos || [];
  var total = (d.tarefas || []).length;
  var html = [];
  var chip = function (id, nome, n) {
    return '<button class="chip" data-condo="' + esc(id) + '" aria-pressed="' + (S.condo === id) + '"><span>' + esc(nome) + '</span><span class="n">' + n + '</span></button>';
  };
  if (condos.length > 1) html.push(chip('todos', 'Todos', total));
  var muitos = condos.length > 6;
  var resto = [];
  condos.forEach(function (c) {
    if (!muitos || c.pendentes > 0 || S.condo === c.codigo) html.push(chip(c.codigo, c.nome, c.pendentes));
    else resto.push(c);
  });
  if (resto.length) {
    html.push('<label class="sr" for="outroCondo">Outro condomínio</label><select class="outros" id="outroCondo"><option value="">Outro condomínio…</option>' +
      resto.map(function (c) { return '<option value="' + esc(c.codigo) + '">' + esc(c.nome) + '</option>'; }).join('') + '</select>');
  }
  if (condos.length <= 1) { S.condo = condos[0] ? condos[0].codigo : 'todos'; $('condos').hidden = true; }
  else $('condos').hidden = false;
  $('condos').innerHTML = html.join('');
}

function tarefasVisiveis() {
  var lista = S.dados.tarefas || [];
  return S.condo === 'todos' ? lista : lista.filter(function (t) { return t.condo === S.condo; });
}

function variasEmpresas() {
  var set = {};
  (S.dados.tarefas || []).forEach(function (t) { set[t.empresa] = 1; });
  return Object.keys(set).length > 1;
}

function metaDe(t) {
  var partes = [];
  if (S.condo === 'todos' && (S.dados.condos || []).length > 1) partes.push(nomeCondo(t.condo));
  if (t.categoria && t.categoria !== 'Geral') partes.push(t.categoria);
  else if (variasEmpresas()) partes.push(t.empresa);
  if (t.paraVoce) partes.push('direcionada a você');
  else if (t.direcionadoNome && t.direcionadoNome !== 'Equipe') partes.push('para ' + t.direcionadoNome);
  partes.push(t.nObs ? (t.nObs === 1 ? '1 follow-up' : t.nObs + ' follow-ups') : 'sem follow-up');
  partes.push(haQuanto(t.criadoEm));
  return partes.join(' · ');
}

function cartao(t) {
  return '<article class="cartao' + (S.selId === t.id ? ' sel' : '') + '" data-id="' + esc(t.id) + '">' +
    (t.urgente ? '<div class="posicao" aria-label="Urgente ' + t.posicao + '">' + t.posicao + '</div>' : '') +

      '</span>' +

function desenharLista() {
  var vis = tarefasVisiveis();
  var urg = vis.filter(function (t) { return t.urgente; });
  var voce = vis.filter(function (t) { return !t.urgente && t.paraVoce; });
  var eq = vis.filter(function (t) { return !t.urgente && !t.paraVoce; });
  var html = '';
  if (urg.length) html += '<section class="secao urg"><h2>Urgentes</h2>' + urg.map(cartao).join('') + '</section>';
  if (voce.length) html += '<section class="secao voce"><h2>Para você</h2>' + voce.map(cartao).join('') + '</section>';
  html += '<section class="secao"><h2>Equipe</h2>' + (eq.length ? eq.map(cartao).join('') :
    '<p class="vazio">' + (vis.length ? 'Nada mais para a equipe.' : 'Tudo em dia por aqui.') + '</p>') + '</section>';
  $('lista').innerHTML = html;
}

/* ================= Concluir e desfazer ================= */
function concluir(id) {
  var t = (S.dados.tarefas || []).filter(function (x) { return x.id === id; })[0];
  if (!t) return;
  S.dados.tarefas = S.dados.tarefas.filter(function (x) { return x.id !== id; });
  var c = (S.dados.condos || []).filter(function (x) { return x.codigo === t.condo; })[0];
  if (c) c.pendentes = Math.max(0, c.pendentes - 1);
  if (S.selId === id) fecharDetalhe();
  desenhar();
  api('tarefas.concluir', { id: id }).then(function (r) {
    if (r.jaConcluida) { avisar('Essa tarefa já tinha sido concluída' + (r.por ? ' por ' + r.por : '') + '.'); recarregar(); return; }
    if (!r.ok) { avisar(r.mensagem, true); recarregar(); return; }
    var seg = r.desfazerSeg || (S.dados.regras && S.dados.regras.desfazerSeg) || 5;
    avisar('Tarefa concluída', false, { rotulo: 'Desfazer', seg: seg, fn: function () { desfazer(id); } });
    setTimeout(recarregar, (seg + 1) * 1000);
  });
}
function desfazer(id) {
  api('tarefas.desfazer', { id: id }).then(function (r) {
    if (!r.ok) avisar(r.mensagem, true);
    recarregar();
  });
}

/* ================= Tarefa aberta ================= */
function abrirTarefa(id, silencioso) {
  S.selId = id; S.editandoDesc = false; S.editandoTitulo = false;
  document.body.classList.add('com-sel');
  marcarSelecionado();
  if (!silencioso || !S.det || S.det.id !== id) {
    S.det = null;
    $('detalhe').innerHTML = cabDetalheVoltar() + '<div class="carregando">Abrindo…</div>';
  }
  api('tarefas.abrir', { id: id }).then(function (r) {
    if (S.selId !== id) return;
    if (!r.ok) { avisar(r.mensagem, true); fecharDetalhe(); recarregar(); return; }
    S.det = r.tarefa;
    desenharDetalhe();
    lerAlertasDa(id);
  });
}
function fecharDetalhe() {
  S.selId = null; S.det = null; S.editandoDesc = false;

function ajustarAltura(el) {
  if (!el) return;
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight + 2, 200) + 'px';
}

function acaoDetalhe(acao, dados, depois) {
  var t = S.det; if (!t) return;
  var payload = Object.assign({ id: t.id }, dados || {});
  return api('tarefas.' + acao, payload).then(function (r) {
    if (!r.ok) { avisar(r.mensagem, true); return r; }
    if (depois) depois(r);
    abrirTarefa(t.id, true);
    recarregar();
    return r;
  });
}

/* Master: tarefa cadastrada no condomínio errado. O motor dá um ID novo do condomínio certo. */
function trocarCondominio(cod) {
  var t = S.det; if (!t || cod === t.condo) return;
  var c = (t.condosParaTrocar || []).filter(function (x) { return x.codigo === cod; })[0];
  if (!c) return;
  var emps = c.empresas || [];
  var enviar = function (emp) {
    var sel = $('selCondo'); if (sel) sel.disabled = true;
    api('tarefas.trocarCondominio', { id: t.id, condo: cod, empresa: emp }).then(function (r) {
      if (!r.ok) { avisar(r.mensagem, true); desenharDetalhe(); return; }
      if (r.semMudanca || !r.tarefa) { abrirTarefa(t.id, true); return; }
      S.condo = cod;
      avisar('Tarefa movida para ' + c.nome + ' · novo nº ' + r.tarefa.id);
      recarregar();
      abrirTarefa(r.tarefa.id);
    });
  };
  if (emps.indexOf(t.empresa) >= 0) { enviar(t.empresa); return; }
  if (emps.length === 1) { enviar(emps[0]); return; }
  if (!emps.length) { avisar('Nenhuma empresa atende ' + c.nome + ' no app.', true); desenharDetalhe(); return; }
  var h = '<div class="jan-corpo"><p class="desc">A empresa ' + esc(t.empresa) + ' não atende ' + esc(c.nome) + '. Escolha a empresa da tarefa lá:</p>' +
    '<label class="rot-campo" for="trocaEmp">Empresa</label><select class="campo" id="trocaEmp">' +
    emps.map(function (e) { return '<option>' + esc(e) + '</option>'; }).join('') + '</select>' +
    '<div class="jan-rodape"><button class="bt claro" type="button" data-acao="fecharJan">Cancelar</button><button class="bt" type="button" id="trocaOk">Mover tarefa</button></div></div>';
  abrirJanela('Trocar condomínio', 'Escolha a empresa', h, 'centro', function (raiz) {
    raiz.querySelector('#trocaOk').addEventListener('click', function () {
      var emp = raiz.querySelector('#trocaEmp').value;
      fecharCamadas(); enviar(emp);
    });
  });
  desenharDetalhe();
}

/* ================= Compartilhar ================= */
function compartilharCriada() {
  var t = S.ultimaCriada; if (!t) return;
  if (!tarefaPorId(t.id) && S.dados) S.dados.tarefas = (S.dados.tarefas || []).concat([t]);

/* Segurar o cartão: iOS não dispara contextmenu, então há um temporizador de toque; Android e computador usam contextmenu. */
var segurar = { timer: null, x: 0, y: 0, ultimo: 0, ignorarClique: false };
function cartaoIdDe(el) { var c = el && el.closest && el.closest('.cartao'); return c ? c.getAttribute('data-id') : null; }
function dispararSegurar(id) {
  if (Date.now() - segurar.ultimo < 900) return;
  var t = tarefaPorId(id); if (!t || !podeCompartilhar(t.condo)) return;
  segurar.ultimo = Date.now(); segurar.ignorarClique = true;
  if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
  abrirOpcoes(id, false);
}
document.addEventListener('touchstart', function (e) {
  var id = cartaoIdDe(e.target); if (!id || e.target.closest('.concluir')) return;
  var p = e.touches[0]; segurar.x = p.clientX; segurar.y = p.clientY;
  clearTimeout(segurar.timer);
  segurar.timer = setTimeout(function () { dispararSegurar(id); }, 550);
}, { passive: true });
document.addEventListener('touchmove', function (e) {
  var p = e.touches[0];
  if (Math.abs(p.clientX - segurar.x) > 10 || Math.abs(p.clientY - segurar.y) > 10) clearTimeout(segurar.timer);
}, { passive: true });
document.addEventListener('touchend', function () { clearTimeout(segurar.timer); }, { passive: true });
document.addEventListener('touchcancel', function () { clearTimeout(segurar.timer); }, { passive: true });
document.addEventListener('contextmenu', function (e) {
  var id = cartaoIdDe(e.target); if (!id) return;
  var t = tarefaPorId(id); if (!t || !podeCompartilhar(t.condo)) return;
  e.preventDefault(); clearTimeout(segurar.timer); dispararSegurar(id);
});

function criarTarefa(raiz, condo, confirmar) {
  var titulo = raiz.querySelector('#novaTitulo').value.trim();
  var erro = raiz.querySelector('#novaErro');
  if (!titulo) { erro.textContent = 'Escreva o título da tarefa.'; erro.hidden = false; raiz.querySelector('#novaTitulo').focus(); return; }
  var chaveOn = raiz.querySelector('#novaChaveDesc').getAttribute('aria-checked') === 'true';
  var dados = {
    condo: condo,
    empresa: raiz.querySelector('#novaEmp').value,
    titulo: titulo,
    categoria: raiz.querySelector('#novaCat') ? raiz.querySelector('#novaCat').value : 'Geral',
    direcionado: raiz.querySelector('#novaDir') ? raiz.querySelector('#novaDir').value : 'Equipe',
    descricao: chaveOn ? raiz.querySelector('#novaDesc').value : '',
    confirmarDuplicada: !!confirmar
  };
  var bt = raiz.querySelector('#novaCriar');
  bt.disabled = true; bt.textContent = 'Criando…'; erro.hidden = true;
  api('tarefas.criar', dados).then(function (r) {
    bt.disabled = false; bt.textContent = 'Criar tarefa';
    if (!r.ok) { erro.textContent = r.mensagem; erro.hidden = false; return; }
    if (r.aviso === 'DUPLICADA') {
      erro.innerHTML = 'Já existe uma tarefa pendente com esse título neste condomínio. ' +
        '<button type="button" class="bt-link" id="novaMesmoAssim">Criar mesmo assim</button>';
      erro.hidden = false;
      raiz.querySelector('#novaMesmoAssim').addEventListener('click', function () { criarTarefa(raiz, condo, true); });
      return;
    }
    guardarLocal('ultimoCondo', condo);
    fecharCamadas();
    var nova = r.tarefa;
    if (nova && podeCompartilhar(nova.condo)) {
      S.ultimaCriada = nova;
      avisar('Tarefa criada', false, { rotulo: 'Compartilhar', seg: 7, fn: function () { compartilharCriada(); } });
    } else avisar('Tarefa criada');
    if (S.condo !== 'todos' && S.condo !== condo) S.condo = condo;
    recarregar();
  });
}

function ligarMicrofone(bt, campo) {
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  bt.addEventListener('click', function () {
    if (rec) { rec.stop(); return; }
    rec = new Rec();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.maxAlternatives = 1;
    var base = campo.value ? campo.value.trim() + ' ' : '';
    bt.classList.add('ouvindo'); bt.setAttribute('aria-label', 'Parar de ditar');
    rec.onresult = function (e) {
      var txt = '';
      for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      campo.value = (base + txt).slice(0, 120);
    };
    rec.onend = rec.onerror = function () {
      bt.classList.remove('ouvindo'); bt.setAttribute('aria-label', 'Ditar o título'); rec = null;
    };
    rec.start();
  });
}

            '<button class="bt claro" data-acao="fecharJan">Voltar ao que eu fazia</button></div>');
        });
      } else if (b.getAttribute('data-acao') === 'minhas') {
        corpo('<div class="jan-corpo"><div class="carregando">Carregando…</div></div>');
        api('tarefas.minhasSugestoes').then(function (r) {
          var lista = (r && r.sugestoes) || [];
          corpo('<div class="jan-corpo">' + (lista.length ? lista.map(function (s) {
            return '<div class="sug-item"><span class="sug-status">' + esc(s.status) + '</span><span>' + esc(s.texto) + '</span>' +
              '<small>' + esc(s.tipo) + ' · ' + esc(quando(s.em)) + '</small>' +
              (s.resposta ? '<div class="sug-resp"><b>Resposta:</b> ' + esc(s.resposta) + '</div>' : '') + '</div>';
          }).join('') : '<p class="cartao-meta" style="margin:0">Você ainda não enviou sugestões.</p>') +
            '<div class="jan-rodape"><button class="bt-link" data-acao="novaSug">Nova sugestão</button><button class="bt claro" data-acao="fecharJan">Fechar</button></div></div>');
        });
      } else if (b.getAttribute('data-acao') === 'novaSug') {
        tipo = null; corpo(form());
      }
    });
  }, true);
}

/* ================= Camadas (janelas, menus, avisos) ================= */
function fecharCamadas() { $('camadas').innerHTML = ''; document.body.classList.remove('janela-aberta'); document.removeEventListener('keydown', escFecha); }
function escFecha(e) { if (e.key === 'Escape') fecharCamadas(); }
function abrirJanela(titulo, sub, corpoHtml, tipo, montar, semFundoNoComputador) {
  var fundo = (semFundoNoComputador && faixa() === 'computador') ? '' : '<div class="fundo" data-acao="fecharJan"></div>';
  $('camadas').innerHTML = fundo + '<section class="janela ' + tipo + '" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '">' +
    '<div class="jan-cab"><span class="alca" aria-hidden="true"></span><div><b>' + esc(titulo) + '</b><small>' + esc(sub) + '</small></div>' +
    '<button class="fechar" data-acao="fecharJan" aria-label="Fechar">' + IC.fechar + '</button></div>' + corpoHtml + '</section>';
  var raiz = $('camadas').querySelector('.janela');
  document.body.classList.add('janela-aberta');
  if (montar) montar(raiz);
  document.addEventListener('keydown', escFecha);
}
function abrirMenu(ancora, html, montar) {
  fecharCamadas();
  var r = ancora.getBoundingClientRect();
  $('camadas').innerHTML = '<div class="fundo" data-acao="fecharJan" style="background:transparent"></div><div class="menu" role="menu"></div>';
  var m = $('camadas').querySelector('.menu');
  m.innerHTML = html;
  m.style.top = (r.bottom + 8) + 'px';
  m.style.right = Math.max(12, window.innerWidth - r.right) + 'px';
  if (montar) montar(m);
  document.addEventListener('keydown', escFecha);
}
var avisoTimer = null;
function avisar(texto, erro, acao) {
  clearTimeout(avisoTimer);
  var area = $('avisoArea');
  area.innerHTML = '<div class="aviso' + (erro ? ' erro' : '') + '" role="status"><span>' + esc(texto || 'Algo deu errado. Tente de novo.') + '</span>' +
    (acao ? '<button id="avisoBt">' + esc(acao.rotulo) + '</button>' : '') + '</div>';
  if (acao) $('avisoBt').addEventListener('click', function () { area.innerHTML = ''; acao.fn(); });
  avisoTimer = setTimeout(function () { area.innerHTML = ''; }, ((acao && acao.seg) || (erro ? 6 : 3)) * 1000);
}

/* ================= Eventos ================= */
document.addEventListener('click', function (e) {
  if (segurar.ignorarClique && cartaoIdDe(e.target)) { segurar.ignorarClique = false; e.preventDefault(); return; }
  segurar.ignorarClique = false;
  var sh = e.target.closest('[data-compartilhar]');
  if (sh) { e.preventDefault(); compartilhar(sh.getAttribute('data-compartilhar')); return; }
  var b = e.target.closest('button, a[data-acao], .fundo, .fundo-det');
  if (!b) return;
  if (b.id === 'fundoDet') { fecharDetalhe(); return; }
  var acao = b.getAttribute('data-acao');
  if (b.hasAttribute('data-concluir')) { concluir(b.getAttribute('data-concluir')); return; }
  if (b.hasAttribute('data-abrir')) { abrirTarefa(b.getAttribute('data-abrir')); return; }
  if (b.hasAttribute('data-condo')) { S.condo = b.getAttribute('data-condo'); desenharCondos(); desenharLista(); return; }
  if (b.hasAttribute('data-tela')) { guardarLocal('tela', b.getAttribute('data-tela')); aplicarTela(); return; }
  if (b.hasAttribute('data-mover')) { acaoDetalhe('mover', { direcao: b.getAttribute('data-mover') }); return; }
  if (b.hasAttribute('data-excluirobs')) {
    var idObs = b.getAttribute('data-excluirobs');
    api('tarefas.excluirObs', { id: idObs }).then(function (r) {
      if (!r.ok) avisar(r.mensagem, true);
      if (S.det) abrirTarefa(S.det.id, true);
      recarregar();
    });
    return;
  }
  switch (acao) {
    case 'fecharJan': fecharCamadas(); break;
    case 'fecharDet': fecharDetalhe(); break;
    case 'nova': abrirNova(); break;
    case 'sugerir': abrirSugestao(); break;
    case 'topo': fecharDetalhe(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'sair': fecharCamadas(); sair(); break;
    case 'atualizar': fecharCamadas(); recarregar().then(function () { avisar('Lista atualizada'); }); break;
    case 'urgente': marcarUrgente(); break;
    case 'concluirDet': concluir(S.det.id); break;
    case 'reabrir': acaoDetalhe('reabrir', {}, function () { avisar('Tarefa reaberta'); }); break;
    case 'enviarObs': enviarObs(); break;
    case 'editarTitulo': S.editandoTitulo = true; desenharDetalhe(); var it = $('txtTitulo'); it.focus(); it.select(); break;
    case 'cancelarTitulo': S.editandoTitulo = false; desenharDetalhe(); break;
    case 'salvarTitulo': salvarTitulo(); break;
    case 'compartDet': if (S.det) compartilhar(S.det.id); break;
    case 'editarDesc': S.editandoDesc = true; desenharDetalhe(); $('txtDesc').focus(); break;
    case 'cancelarDesc': S.editandoDesc = false; desenharDetalhe(); break;
    case 'salvarDesc':
      var txt = $('txtDesc').value;
      S.editandoDesc = false;
      acaoDetalhe('descricao', { texto: txt, versao: S.det.versao });
      break;
  }
  if (b.id === 'btSino') abrirSino();
  if (b.id === 'btPerfil') abrirPerfil();
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'outroCondo' && el.value) { S.condo = el.value; desenharCondos(); desenharLista(); }
  if (el.id === 'selDir') acaoDetalhe('direcionar', { para: el.value });
  if (el.id === 'selEmp') acaoDetalhe('trocarEmpresa', { empresa: el.value });
  if (el.id === 'selCondo') trocarCondominio(el.value);
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'txtObs' && S.det) { S.rascunhoObs[S.det.id] = e.target.value; ajustarAltura(e.target); }
});
document.addEventListener('keydown', function (e) {
  if (e.target.id === 'txtObs' && e.key === 'Enter' && !e.shiftKey && faixa() === 'computador') { e.preventDefault(); enviarObs(); }
  if (e.target.id === 'txtTitulo' && e.key === 'Enter') { e.preventDefault(); salvarTitulo(); }
  if (e.target.id === 'txtTitulo' && e.key === 'Escape') { e.stopPropagation(); S.editandoTitulo = false; desenharDetalhe(); return; }
  if (e.key === 'Escape' && S.selId && !$('camadas').innerHTML) fecharDetalhe();
});
var ultimaFaixa = faixa();
window.addEventListener('resize', function () {
  var f = faixa();
  if (f !== ultimaFaixa) { ultimaFaixa = f; if (S.sessao && !$('app').hidden) { aplicarTela(); abrirApp(); } }
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible' && S.sessao && !$('app').hidden) recarregar();
});
setInterval(function () { if (document.visibilityState === 'visible' && S.sessao && !$('app').hidden && !S.carregandoDet) recarregar(); }, 120000);

/* ================= Início ================= */
function carregarScriptGoogle() {
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
  document.head.appendChild(s);
}
function iniciar() {
  guardarLinkDireto();
  S.sessao = ler('sessao');
  try { S.google = JSON.parse(ler('google') || 'null'); } catch (e) { S.google = null; }
  if (S.sessao) {
    $('entradaTexto').textContent = 'Abrindo…';
    recarregar(); // a casca abre assim que o portal e as tarefas chegam
  }
  chamar({ fn: 'config' }).then(function (c) {
    if (!c.ok || !c.clientId) { if (!S.sessao) mostrarEntrada(c.mensagem || 'Não foi possível carregar o aplicativo. Tente de novo em instantes.'); return; }
    S.cfg = c;
    carregarScriptGoogle();
    if (!S.sessao) mostrarEntrada();
  });
}
iniciar();
})();
</script>
