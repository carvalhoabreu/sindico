<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Síndico · Carvalho &amp; Abreu</title>
<meta name="description" content="Portal da Carvalho & Abreu Sindicância Profissional.">
<meta name="theme-color" content="#0F2646">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Síndico">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0F2646; --azul2:#16325C; --ouro:#C9A46A; --ouro-claro:#E3C894; --ouro-fundo:#F3E6CC;
  --creme:#F8F4EC; --creme2:#F1EBDD; --linha:#E2DACA; --linha2:#ECE5D6;
  --texto:#1E2B45; --suave:#5C6680; --suave2:#3D4863; --vinho:#8A2E2E; --vinho-fundo:#F6E9E6;
  --sombra:0 1px 6px rgba(15,38,70,.05); --sombra-alta:0 12px 36px rgba(15,38,70,.22);
  --topo-seg:env(safe-area-inset-top,0px); --baixo-seg:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--texto);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.serif{font-family:Lora,Georgia,serif}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}

/* ---------- Entrada ---------- */
#entrada{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--topo-seg)) 20px calc(24px + var(--baixo-seg))}
.entrada-caixa{width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:var(--sombra-alta);overflow:hidden;text-align:center}
.entrada-topo{background:var(--azul);padding:28px 24px 22px;border-bottom:3px solid var(--ouro)}
.entrada-topo img{width:88px;height:88px;border-radius:50%;background:#fff;border:3px solid var(--ouro)}
.entrada-topo h1{margin:12px 0 2px;color:#fff;font-size:1.75rem}
.entrada-topo p{margin:0;color:var(--ouro-claro);font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.entrada-corpo{padding:26px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.entrada-corpo p{margin:0;color:var(--suave);font-size:.95rem}
#botaoGoogle{min-height:44px;display:flex;justify-content:center}
.entrada-msg{font-size:.9rem;color:var(--vinho);background:var(--vinho-fundo);border-radius:10px;padding:10px 12px;width:100%}
.entrada-rodape{padding:0 24px 18px;font-size:.8rem}
.entrada-rodape a{color:var(--suave)}

/* ---------- Casca ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topo{background:#fff;border-bottom:1px solid var(--linha2);padding:calc(.75em + var(--topo-seg)) 1.75em .75em;display:flex;align-items:center;gap:1.25em;position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:.75em;flex:1 1 auto;min-width:0}
.marca img{width:2.5em;height:2.5em;border-radius:50%;border:2px solid var(--ouro);background:#fff;flex:none}
.marca-nomes{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;min-width:0}
.marca-nome{font-family:Lora,Georgia,serif;font-weight:700;font-size:1.375em;color:var(--azul);line-height:1.1}
.marca-sub{font-size:.75em;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#6B5A3A}
.telas{display:flex;align-items:center;gap:.5em}
.telas span{font-size:.8125em;color:var(--suave)}
.telas-grupo{display:flex;background:var(--creme2);border-radius:.75em;padding:.25em;gap:.25em}
.telas-grupo button{min-height:2.25em;padding:0 .8em;border-radius:.55em;border:none;background:transparent;color:var(--suave2);font-size:.8125em;font-weight:600}
.telas-grupo button[aria-pressed="true"]{background:var(--azul);color:#fff}
.icone-bt{position:relative;width:2.75em;height:2.75em;border-radius:50%;border:1px solid var(--linha);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.selo{position:absolute;top:-.2em;right:-.2em;min-width:1.25em;height:1.25em;border-radius:999px;background:var(--vinho);color:#fff;font-size:.6875em;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .3em}
.perfil{display:flex;align-items:center;gap:.6em;background:none;border:none;padding:.25em;border-radius:999px;text-align:left}
.avatar{width:2.5em;height:2.5em;border-radius:50%;background:var(--creme2);color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.875em;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.perfil-txt{display:flex;flex-direction:column;line-height:1.25}
.perfil-txt b{font-size:.875em;font-weight:600;color:var(--azul)}
.perfil-txt small{font-size:.75em;color:var(--suave)}

.corpo{display:flex;flex:1;min-height:0}
.lateral{flex:none;width:15em;background:var(--azul);color:#fff;padding:1.5em .875em;display:flex;flex-direction:column;gap:.25em}
.lat-titulo{font-size:.6875em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro);padding:0 .9em .6em}
.lat-titulo.cinza{color:#8C99B3;padding-top:1.6em}
.lat-item{display:flex;align-items:center;gap:.75em;min-height:2.75em;padding:0 .9em;border-radius:.75em;color:#fff;text-decoration:none;font-weight:600;font-size:.9375em;background:none;border:none;width:100%;text-align:left}
.lat-item[aria-current="page"]{background:rgba(201,164,106,.18)}
.lat-item .cont{min-width:1.6em;height:1.6em;border-radius:999px;background:var(--ouro);color:var(--azul);font-size:.8em;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .4em}
.lat-breve{display:flex;align-items:center;gap:.75em;min-height:2.4em;padding:0 .9em;color:#A9B4C9;font-size:.9375em}
.lat-breve i{width:.5em;height:.5em;border-radius:50%;border:1.5px solid #6B7A99;flex:none}
.lat-esp{flex:1;min-height:1.5em}
.lat-rodape{font-size:.75em;color:#8C99B3;padding:.6em .9em 0}
.lat-rodape a{color:#A9B4C9}

.coluna-icones{display:none}
.principal{flex:1;min-width:0;padding:1.75em 2em 2.5em;display:flex;flex-direction:column;gap:1.25em}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:1em 1.5em}
.cab h1{margin:0;font-family:Lora,Georgia,serif;font-weight:700;font-size:1.75em;color:var(--azul)}
.abas{display:flex;gap:.25em;flex:1 1 auto}
.abas button{min-height:2.75em;padding:0 1em;border:none;background:none;border-bottom:3px solid transparent;color:var(--suave);font-weight:500;font-size:.9375em}
.abas button[aria-selected="true"]{border-bottom-color:var(--ouro);color:var(--azul);font-weight:700}
.bt{min-height:2.75em;padding:0 1.25em;border-radius:.75em;border:none;background:var(--azul);color:#fff;font-weight:600;font-size:.9375em;display:inline-flex;align-items:center;justify-content:center;gap:.5em}
.bt.claro{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.ocupado{pointer-events:none;opacity:.72;-webkit-user-select:none;user-select:none}
.ocupado.girando::before{content:"";width:1em;height:1em;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:gira .7s linear infinite;flex:none}
.ocupado.girando svg{display:none}
@keyframes gira{to{transform:rotate(360deg)}}
.salvando-rot::after{content:" · Salvando…";font-weight:500;color:var(--ouro2,#9C7A3C);text-transform:none;letter-spacing:0}
.conf-tit{margin:0;font-family:Lora,Georgia,serif;font-weight:700;font-size:1.125em;line-height:1.3;color:var(--azul);overflow-wrap:anywhere}
.conf-rodape{display:flex;gap:.75em;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:767px){.conf-rodape{flex-direction:column-reverse}.conf-rodape .bt{width:100%}}
.bt.ouro{background:#fff;color:var(--azul);border:1.5px solid var(--ouro)}
.bt.grande{min-height:3.25em;border-radius:.875em;font-weight:700;font-size:1em;width:100%}
.bt:disabled{opacity:.55;cursor:default}
.bt-link{background:none;border:none;padding:.4em 0;color:var(--azul);font-weight:600;font-size:.875em;text-decoration:underline;text-decoration-color:var(--ouro);text-underline-offset:3px}

.condos{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.chip{min-height:2.75em;display:inline-flex;align-items:center;gap:.5em;padding:0 .875em 0 1.1em;border-radius:999px;font-size:.9375em;font-weight:600;background:#fff;color:var(--azul);border:2px solid var(--linha);white-space:nowrap;flex:none}
.chip .n{min-width:1.5em;height:1.5em;padding:0 .4em;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:.8125em;font-weight:700;background:var(--creme2);color:var(--azul)}
.chip[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
.chip[aria-pressed="true"] .n{background:var(--ouro)}
.outros{min-height:2.75em;border-radius:999px;border:2px dashed var(--linha);background:#fff;color:var(--azul);font-weight:600;font-size:.9375em;padding:0 1em}

.area{display:flex;gap:1.5em;align-items:flex-start}
.lista{flex:1 1 24em;min-width:0;display:flex;flex-direction:column;gap:1.5em}
.secao{display:flex;flex-direction:column;gap:.6em}
.secao h2{margin:0;font-size:.8125em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.secao.urg h2{color:#7A5C27}
.secao.voce h2{color:var(--azul)}
.cartao{display:flex;align-items:center;gap:.875em;padding:.75em .875em .75em 1em;border-radius:1em;background:#fff;border:2px solid transparent;box-shadow:var(--sombra)}
.secao.urg .cartao{border-color:var(--ouro);box-shadow:none}
.secao.voce .cartao{border-color:var(--ouro-claro);box-shadow:none}
.cartao.sel{border-color:var(--azul)!important}
.secao.voce .cartao.sel{background:var(--ouro-fundo)}
.posicao{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--ouro);color:var(--azul);font-weight:700;font-size:.9375em;display:flex;align-items:center;justify-content:center}
.cartao-abrir{flex:1;min-width:0;min-height:2.75em;text-align:left;background:none;border:none;padding:0;display:flex;flex-direction:column;gap:.3em;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.compart{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.3em;width:2em;height:1.6em;margin:-.3em -.4em -.3em .05em;border-radius:.5em;color:#9AA3B5;cursor:pointer}
.compart:hover,.compart:active{color:var(--azul2);background:#EEF1F6}
.edit-tit{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.12em;width:1.5em;height:1.5em;margin-left:.15em;padding:0;border:none;border-radius:.4em;background:none;color:#9AA3B5;cursor:pointer}
.edit-tit svg{width:.72em;height:.72em}
.edit-tit:hover,.edit-tit:focus-visible{color:var(--azul2);background:#EEF1F6}
.det-topo{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.bt-compart{display:inline-flex;align-items:center;gap:.4em;margin-left:auto;min-height:2.75em;padding:0 .8em;border-radius:999px;border:1px solid var(--linha);background:#fff;color:var(--azul);font-weight:600;font-size:.9375em}
.bt-compart:hover{border-color:var(--ouro)}
.opc-lista{display:flex;flex-direction:column;gap:.25em}
.cartao-titulo{font-size:1.0625em;font-weight:500;line-height:1.3;color:var(--texto);overflow-wrap:anywhere}
.secao.urg .cartao-titulo,.secao.voce .cartao-titulo{font-weight:600;color:var(--azul)}
.cartao-meta{font-size:.8125em;color:var(--suave)}
.etiqueta{align-self:flex-start;font-size:.75em;font-weight:600;color:var(--vinho);background:var(--vinho-fundo);border-radius:999px;padding:.3em .7em}
.concluir{flex:none;width:2.75em;height:2.75em;border-radius:50%;border:2px solid #B8C0D0;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.concluir svg{stroke:#8A93A8}
.secao.urg .concluir{border:2.5px solid var(--azul)}
.secao.urg .concluir svg{stroke:var(--azul)}
.secao.voce .concluir{border:none;background:var(--ouro)}
.secao.voce .concluir svg{stroke:var(--azul)}
.vazio{margin:0;padding:1.25em;text-align:center;color:var(--suave);font-size:.9375em;background:#fff;border-radius:1em}
.carregando{padding:2.5em 1em;text-align:center;color:var(--suave)}



/* ---------- v1.10: fila sem sinal, compartilhamento e registro automático ---------- */
.anx-tile.aguardando .anx-prog{background:rgba(15,38,70,.42)}
.anx-tile.aguardando .anx-prog svg{stroke:#E3C894}
.anx-fila{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;background:#FBF3E2;border:1px solid #EAD7AE;border-radius:.75em;padding:.6em .8em;font-size:.8125em;color:#5A4520}
.anx-fila svg{flex:none;stroke:#7A5C27}
.anx-fila span{flex:1;min-width:12em}
.obs-auto{display:flex;align-items:center;gap:.5em;width:100%;padding:.35em .25em;border:none;background:none;text-align:left;font:inherit;font-size:.8125em;color:var(--suave);border-radius:.5em}
button.obs-auto{cursor:pointer}
button.obs-auto:hover{background:var(--creme)}
.obs-auto svg{flex:none;color:var(--suave)}
.obs-auto span{flex:1;min-width:0}
.obs-auto b{color:var(--suave2);font-weight:600}
.obs-auto time{flex:none;font-size:.92em;color:#8A93A8}
.nova-anexos{display:flex;align-items:center;gap:.5em;margin:0;background:var(--creme);border-radius:.6em;padding:.55em .75em;font-size:.875em;font-weight:600;color:var(--azul)}
.comp-recebidos{display:flex;gap:.5em;flex-wrap:wrap}
.comp-recebidos img{width:4em;height:4em;object-fit:cover;border-radius:.6em;background:var(--creme2)}
.comp-doc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em;width:7em;height:4em;border-radius:.6em;background:var(--creme);border:1px solid var(--linha);padding:.3em;box-sizing:border-box}
.comp-doc small{font-size:.6875em;color:var(--suave2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comp-mais{display:flex;align-items:center;justify-content:center;width:4em;height:4em;border-radius:.6em;background:var(--creme2);font-weight:700;color:var(--azul)}
.comp-msg{background:var(--creme);border-radius:.75em;padding:.65em .8em;display:flex;flex-direction:column;gap:.5em}
.comp-msg p{margin:0;font-size:.875em;color:var(--texto);white-space:pre-line}
.comp-check{display:flex;align-items:center;gap:.5em;font-size:.8125em;font-weight:600;color:var(--suave2)}
.comp-check input{width:1.2em;height:1.2em;accent-color:var(--azul)}
.comp-nova{width:100%;justify-content:center}
.comp-nova svg{stroke:var(--azul)}
.comp-lista{display:flex;flex-direction:column;gap:.35em;max-height:40vh;overflow-y:auto}
.comp-grupo{font-size:.75em;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#7A5C27;margin:.5em 0 .1em}
.comp-item{display:flex;flex-direction:column;gap:.15em;text-align:left;width:100%;min-height:3em;padding:.55em .8em;border-radius:.75em;border:1.5px solid var(--linha);background:#fff;color:inherit;font:inherit;cursor:pointer}
.comp-item:hover,.comp-item:focus-visible{border-color:var(--ouro)}
.comp-item b{font-size:.9375em;font-weight:600;color:var(--azul)}
.comp-item small{font-size:.75em;color:var(--suave)}
.comp-vazio{margin:.25em 0}
.comp-criar{width:100%;justify-content:center}
/* ---------- v1.9: anexos e fotos Antes/Depois ---------- */
.anx{gap:.75em}
#blocoAnexos{display:flex;flex-direction:column;gap:1.25em}
#blocoAnexos:empty{display:none}
.anx-cab{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.anx-etapa{display:flex;flex-direction:column;gap:.45em;border-radius:.75em;transition:background .15s}
.anx-rot{display:flex;align-items:center;gap:.45em;font-size:.875em;font-weight:700;color:var(--azul)}
.anx-rot small{font-size:.85em;font-weight:600;color:var(--suave)}
.anx-dot{width:.55em;height:.55em;border-radius:50%;background:#9AA3B8;display:inline-block}
.anx-dot.d{background:var(--ouro)}
.anx-faixa{display:flex;gap:.5em;flex-wrap:wrap}
.anx-tile{width:4.5em;height:4.5em;border-radius:.65em;overflow:hidden;flex:none;position:relative;border:none;padding:0;background:var(--creme2);cursor:pointer}
.anx-tile img{width:100%;height:100%;object-fit:cover;display:block}
.anx-tile img:not([src]),.anx-tile img[src=""]{opacity:0}
.anx-tile.enviando{cursor:default}
.anx-prog{position:absolute;inset:0;background:rgba(15,38,70,.55);color:#fff;font-weight:700;font-size:.8125em;display:flex;align-items:center;justify-content:center}
.anx-gira{width:1.4em;height:1.4em;border-radius:50%;border:2.5px solid rgba(255,255,255,.4);border-top-color:#E3C894;animation:gira .8s linear infinite;display:inline-block}
.anx-add{width:4.5em;height:4.5em;border-radius:.65em;flex:none;border:1.5px dashed var(--ouro);background:var(--ouro-fundo,#FBF8F2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;font-size:.6875em;font-weight:600;color:#7A5C27;padding:0;cursor:pointer}
.anx-add.largo{width:auto;flex:1;min-width:12em;max-width:26em;flex-direction:row;gap:.5em;font-size:.875em}
.anx-add.largo svg{stroke:#7A5C27;width:1.25em;height:1.25em}
.anx-arq{display:flex;align-items:center;gap:.75em;min-height:3.25em}
.anx-arq+.anx-arq{border-top:1px solid var(--linha2);padding-top:.5em}
.anx-ext{width:2.6em;height:3em;border-radius:.45em;background:var(--creme2);flex:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.4em;box-sizing:border-box;font-size:.625em;font-weight:800;letter-spacing:.04em;color:#fff}
.anx-ext b{background:var(--azul);color:#fff;border-radius:.3em;padding:.15em .35em;font-size:1em}
.anx-arq.enviando .anx-ext{align-items:center;padding:0}
.anx-arq-abrir{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;display:flex;flex-direction:column;gap:.15em;color:inherit;cursor:pointer;min-height:2.75em;justify-content:center}
.anx-arq-abrir b{font-size:.9375em;font-weight:600;color:var(--azul);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.anx-arq-abrir small{font-size:.8125em;color:var(--suave)}
.anx-x{width:2.75em;height:2.75em;border-radius:50%;border:none;background:none;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.anx-x.confirmar{background:var(--vinho-fundo)}
.arrastando{background:var(--ouro-fundo,#FBF8F2);outline:2px dashed var(--ouro);outline-offset:4px}
.anx-g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:.6em}
.anx-gb{min-height:5.25em;border-radius:.875em;border:1.5px solid var(--linha);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4em;font-weight:600;font-size:.9375em;color:var(--azul)}
.anx-gb:hover{border-color:var(--ouro)}
.menu-item.anx-doc{display:flex;align-items:center;gap:.75em;text-align:left;width:100%;min-height:3.5em;padding:.6em 1em;border:1.5px solid var(--linha);border-radius:.875em;background:#fff}
.anx-doc span{display:flex;flex-direction:column}
.anx-doc small{font-weight:500;color:var(--suave);font-size:.8125em}
.anx-nota{margin:0;font-size:.8125em;color:var(--suave)}

/* ================= Comunicação com o motor ================= */
function chamar(corpo) {
  return fetch(MOTOR, { method: 'POST', body: JSON.stringify(corpo), redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, codigo: 'REDE', mensagem: 'Sem conexão. Confira a internet e tente de novo.' }; });
}
function api(acao, dados) {
  return chamar({ fn: 'api', sessao: S.sessao, acao: acao, dados: dados || {} }).then(function (r) {
    if (!r.ok && (r.codigo === 'SESSAO' || r.codigo === 'NAO_AUTORIZADO' && acao === 'tarefas.inicio')) {
      sair(r.mensagem);
      throw r;
    }
    return r;
  });
}

/* ================= Entrada (login Google) ================= */
function mostrarEntrada(msg) {
  $('app').hidden = true; $('entrada').hidden = false;
  document.body.classList.remove('com-sel');
  $('entradaTexto').textContent = 'Entre com a sua conta Google cadastrada.';
  $('entradaTexto').hidden = false; $('botaoGoogle').hidden = false;
  $('entradaExtra').hidden = true; $('entradaExtra').innerHTML = '';
  S.tokenPendente = null;
  var m = $('entradaMsg');
  if (msg) { m.textContent = msg; m.hidden = false; } else m.hidden = true;
  iniciarGoogle();
}

var googlePronto = false;
function iniciarGoogle() {
  if (!S.cfg || $('entrada').hidden) return;
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(iniciarGoogle, 150); return; }
  if (!googlePronto) { googlePronto = true; google.accounts.id.initialize({
    client_id: S.cfg.clientId, callback: aoEntrarGoogle, auto_select: true,
    cancel_on_tap_outside: true, use_fedcm_for_prompt: true, ux_mode: 'popup'
  }); }
  google.accounts.id.renderButton($('botaoGoogle'), {
    theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'pt-BR', width: 280
  });
  google.accounts.id.prompt();
}

function lerToken(token) {
  try {
    var b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    var json = decodeURIComponent(atob(b).split('').map(function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
    var d = JSON.parse(json);
    return { foto: d.picture || '', nome: d.name || '' };
  } catch (e) { return {}; }
}

function aoEntrarGoogle(resp) {
  $('entradaTexto').textContent = 'Entrando…';
  $('entradaMsg').hidden = true;
  var info = lerToken(resp.credential);
  chamar({ fn: 'entrar', token: resp.credential, convite: ler('convite') || '' }).then(function (r) {
    if (!r.ok) { tratarSemAcesso(r, resp.credential, info); return; }
    concluirEntrada(r, info);
  });
}
function concluirEntrada(r, info) {
  S.sessao = r.sessao; S.google = info; S.tokenPendente = null;
  guardar('sessao', r.sessao); guardar('google', JSON.stringify(info)); guardar('convite', null);
  S.portal = r; S.dados = r.tarefas || null;
  abrirApp();
}

/* ---------- Sem acesso: pedir acesso pelo convite ou aguardar aprovação ---------- */
function lerConviteUrl() {
  try {
    var p = new URLSearchParams(location.search);
    var c = p.get('c');
    if (!c) return;
    guardar('convite', String(c).replace(/[^A-Za-z0-9]/g, '').slice(0, 12));
    p.delete('c');
    var q = p.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
  } catch (e) {}
}
function entradaExtra(html) {
  $('entradaTexto').hidden = true; $('botaoGoogle').hidden = true; $('entradaMsg').hidden = true;
  var x = $('entradaExtra'); x.innerHTML = html; x.hidden = false;
  return x;
}
function tratarSemAcesso(r, token, info) {
  if (r.codigo === 'PEDIR') { mostrarPedir(r, token, info); return; }
  if (r.codigo === 'AGUARDANDO') { mostrarAguardando(r, token, info); return; }
  if (r.codigo === 'CONVITE_VENCIDO' || r.codigo === 'CONVITE_INVALIDO') guardar('convite', null);
  mostrarEntrada(r.mensagem || 'Acesso não autorizado.');
}
function avatarDe(info, nome) {

function gruposFechados() { try { return JSON.parse(lerLocal('gruposFechados') || '[]'); } catch (e) { return []; } }
function guardarGruposFechados(arr) { guardarLocal('gruposFechados', JSON.stringify(arr)); }
function agrupadoPorCondo() { return S.condo === 'todos' && (S.dados.condos || []).length > 1; }

/* Ordem dos grupos: com urgentes primeiro, depois quem tem mais abertas, depois a ordem do cadastro. */
function gruposDaLista(vis) {
  var ordem = (S.dados.condos || []).map(function (c) { return c.codigo; });
  var mapa = {};
  vis.forEach(function (t) { (mapa[t.condo] = mapa[t.condo] || []).push(t); });
  return Object.keys(mapa).map(function (cod) {
    var ts = mapa[cod];
    return { cod: cod, tarefas: ts, urg: ts.filter(function (t) { return t.urgente; }).length };
  }).sort(function (a, b) {
    if ((a.urg > 0) !== (b.urg > 0)) return a.urg > 0 ? -1 : 1;
    if (a.tarefas.length !== b.tarefas.length) return b.tarefas.length - a.tarefas.length;
    return ordem.indexOf(a.cod) - ordem.indexOf(b.cod);
  });
}

function desenharListaPorCondo(vis) {
  var grupos = gruposDaLista(vis);
  var fech = gruposFechados();
  var nUrg = vis.filter(function (t) { return t.urgente; }).length;
  var algumAberto = grupos.some(function (g) { return fech.indexOf(g.cod) < 0; });
  var rotTodos = algumAberto ? 'Recolher todos os condomínios' : 'Expandir todos os condomínios';
  var html = '';
  if (grupos.length) {
    html += '<div class="grupos-resumo"><span>' + vis.length + (vis.length === 1 ? ' aberta' : ' abertas') +
      (nUrg ? ' · ' + nUrg + (nUrg === 1 ? ' urgente' : ' urgentes') : '') + '</span>' +
      '<button class="bt-todos" data-acao="alternarGrupos" aria-label="' + rotTodos + '" title="' + rotTodos + '">' +
      (algumAberto ? IC.recolher : IC.expandir) + '</button></div>';
  }
  grupos.forEach(function (g) {
    var aberto = fech.indexOf(g.cod) < 0;
    var ts = g.tarefas.slice().sort(function (a, b) {
      var pa = a.urgente ? 0 : a.paraVoce ? 1 : 2, pb = b.urgente ? 0 : b.paraVoce ? 1 : 2;
      return pa - pb;
    });
    html += '<section class="grupo' + (aberto ? '' : ' fechado') + '">' +
      '<button class="grupo-cab" data-grupo="' + esc(g.cod) + '" aria-expanded="' + aberto + '">' +
        '<span class="grupo-nome">' + esc(nomeCondo(g.cod)) + '</span>' +
        '<span class="grupo-n">' + g.tarefas.length + '</span>' +
        (g.urg ? '<span class="grupo-urg">' + g.urg + (g.urg === 1 ? ' urgente' : ' urgentes') + '</span>' : '') +
        '<span class="grupo-esp"></span>' + (aberto ? IC.chevBaixo : IC.chevDir) +
      '</button>' +
      (aberto ? '<div class="grupo-corpo">' + ts.map(function (t) { return cartao(t, true); }).join('') + '</div>' : '') +
    '</section>';
  });
  if (!grupos.length) html += '<p class="vazio">Tudo em dia por aqui.</p>';
  var sem = (S.dados.condos || []).length - grupos.length;
  if (grupos.length && sem > 0) html += '<p class="grupos-sem">' + sem + (sem === 1 ? ' condomínio sem pendências' : ' condomínios sem pendências') + '</p>';
  $('lista').innerHTML = html;
}

function alternarGrupo(cod) {
  var fech = gruposFechados();
  var i = fech.indexOf(cod);
  if (i >= 0) fech.splice(i, 1); else fech.push(cod);
  guardarGruposFechados(fech);

function alternarGrupos() {

/* Períodos: datas no dia de São Paulo (AAAA-MM-DD). */
function somarDias(diaTxt, n) { var d = new Date(diaTxt + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function periodoDatas(p) {
  var hoje = diaSP(new Date());
  var ano = Number(hoje.slice(0, 4)), mes = Number(hoje.slice(5, 7));
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var fimMes = function (a, m) { return new Date(Date.UTC(a, m, 0)).getUTCDate(); };
  if (p === '7d') return { de: somarDias(hoje, -6), ate: hoje };
  if (p === '30d') return { de: somarDias(hoje, -29), ate: hoje };
  if (p === 'mesAnt') { var a = mes === 1 ? ano - 1 : ano, m = mes === 1 ? 12 : mes - 1; return { de: a + '-' + pad(m) + '-01', ate: a + '-' + pad(m) + '-' + pad(fimMes(a, m)) }; }
  if (p === 'datas') return { de: S.conc.de || somarDias(hoje, -29), ate: S.conc.ate || hoje };
  return { de: ano + '-' + pad(mes) + '-01', ate: hoje };
}
function competencia(diaTxt) { return diaTxt.slice(5, 7) + '/' + diaTxt.slice(0, 4); }
function rotuloPeriodo() {
  var p = S.conc.periodo, d = periodoDatas(p);
  if (p === 'mes' || p === 'mesAnt') return 'Concluídas ' + competencia(d.de);
  if (p === '7d') return 'Últimos 7 dias';
  if (p === '30d') return 'Últimos 30 dias';

function filtroConc() {

function carregarConcluidas(maisUma) {
  var f = filtroConc(), chave = chaveConc(f);
  var atual = S.conc.res && S.conc.chave === chave ? S.conc.res : null;
  if (!maisUma && atual) { desenharConcluidas(); return; }
  var pagina = maisUma && atual ? atual.pagina + 1 : 0;
  f.pagina = pagina;
  S.conc.carregando = true;
  if (!maisUma) { S.conc.chave = chave; S.conc.res = null; desenharConcluidas(); }
  var bt = $('concMais');
  var liberar = maisUma && bt ? ocupar(bt, 'Carregando…') : function () {};
  api('tarefas.concluidas', f).then(function (r) {
    liberar();
    if (S.conc.chave !== chave) return; // filtro mudou enquanto carregava
    S.conc.carregando = false;
    if (!r.ok) { S.conc.erro = r.mensagem; desenharConcluidas(); return; }
    S.conc.erro = null;
    if (pagina > 0 && S.conc.res) { r.itens = S.conc.res.itens.concat(r.itens); }

}

function duracao(dias) { return dias <= 0 ? 'no mesmo dia' : dias === 1 ? '1 dia' : dias + ' dias'; }

  if (dia === hoje) return 'Hoje · ' + dataCurta(d);
  if (dia === somarDias(hoje, -1)) return 'Ontem · ' + dataCurta(d);
  var sem = new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, weekday: 'short' }).format(d).replace('.', '');

}

function linhaConc(t) {

function desenharConcluidas() {

    '<form class="conc-busca" id="concBuscaForm" role="search"><label class="sr" for="concBusca">Buscar</label>' + IC.lupa +

      '<div><b' + (rs.comMais && S.condo === 'todos' ? ' class="txt">' + esc(rs.comMais.nome) : '>' + (r.empresas || []).length) + '</b><small>' +
      (rs.comMais && S.condo === 'todos' ? 'com mais concluídas' : ((r.empresas || []).length === 1 ? 'empresa' : 'empresas')) + '</small></div></div>';
    if (!r.itens.length) html += '<p class="vazio">' + (c.busca ? 'Nada encontrado com “' + esc(c.busca) + '” neste período.' : 'Nenhuma tarefa concluída neste período.') + '</p>';
    var grupos = [], idx = {};
    r.itens.forEach(function (t) {
      var k = c.agrupar === 'condo' ? nomeCondo(t.condo) : c.agrupar === 'empresa' ? t.empresa : diaSP(new Date(t.concluidoEm));

/* ================= Anexos: fotos Antes/Depois e documentos (v1.9) ================= */
var ANX_PARTE = 5 * 1024 * 1024;
var CACHE_ANX = 'sindico-anexos-v1';
var ETAPA_ROT = { Antes: 'do antes', Depois: 'do depois' };

function cacheLer(chave) {
  if (!('caches' in window)) return Promise.resolve(null);
  return caches.open(CACHE_ANX).then(function (c) { return c.match('/anx/' + chave); })
    .then(function (r) { return r ? r.blob() : null; }).catch(function () { return null; });
}
function cacheGravar(chave, blob) {
  if (!('caches' in window) || !blob) return;
  caches.open(CACHE_ANX).then(function (c) { return c.put('/anx/' + chave, new Response(blob)); }).catch(function () {});
}
function b64ParaBlob(b64, tipo) {
  var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
  for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: tipo || 'application/octet-stream' });
}
function blobParaB64(blob) {
  return new Promise(function (ok, erro) {
    var fr = new FileReader();
    fr.onload = function () { var s = String(fr.result); ok(s.slice(s.indexOf(',') + 1)); };
    fr.onerror = function () { erro(new Error('leitura')); };
    fr.readAsDataURL(blob);
  });
}
function tamanhoTxt(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return Math.round(b / 1024) + ' KB';
  return (b / 1048576).toFixed(1).replace('.', ',') + ' MB';
}
function nomeCurtoAnexo(a) { var p = String(a.nome || '').split(' · '); return p.length > 1 && /-T-\d+$/.test(p[0]) ? p.slice(1).join(' · ') : a.nome; }
function extAnexo(a) {
  var m = /\.([a-z0-9]{1,5})$/i.exec(a.nome || '');
  if (m) return m[1].toUpperCase().slice(0, 4);
  return /pdf/.test(a.tipo) ? 'PDF' : /image/.test(a.tipo) ? 'IMG' : 'ARQ';
}

/* ---------- Fotos: reduzir no próprio aparelho (1600 px + miniatura de 320 px, JPEG, sem localização) ---------- */
function carregarImg(file) {
  return new Promise(function (ok, erro) {
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function () { ok(im); };
    im.onerror = function () { URL.revokeObjectURL(u); erro(new Error('formato')); };
    im.src = u;
  });
}
function carregarImagem(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file, { imageOrientation: 'from-image' }).catch(function () { return carregarImg(file); });
  }
  return carregarImg(file);
}
function reduzir(img, lado, q) {
  var w = img.width, h = img.height, k = Math.min(1, lado / Math.max(w, h));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  var x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(img, 0, 0, c.width, c.height);
  return new Promise(function (ok) { c.toBlob(function (b) { ok(b); }, 'image/jpeg', q); });
}
function prepararFoto(file) {
  return carregarImagem(file).then(function (img) { return Promise.all([reduzir(img, 1600, 0.78), reduzir(img, 320, 0.7)]); });
}

/* ---------- Enviar ---------- */
function ajustarContagem(idTarefa, etapa, delta) {
  var t = ((S.dados && S.dados.tarefas) || []).filter(function (x) { return x.id === idTarefa; })[0];
  if (!t) return;
  var k = etapa === 'Antes' ? 'nAntes' : etapa === 'Depois' ? 'nDepois' : 'nDocs';
  t[k] = Math.max(0, (t[k] || 0) + delta);
}

function enviarAnexo(idTarefa, file, etapa, extra) {
  extra = extra || {};
  var foto = etapa !== 'Documento';
  var item = { idCliente: novoIdCliente(), idTarefa: idTarefa, etapa: etapa, origem: extra.origem || 'app', idObs: extra.idObs || '',
    original: file.size, criadoEm: Date.now() };
  var envios = S.envios[idTarefa] || (S.envios[idTarefa] = []);
  var tmp = { tmp: item.idCliente, etapa: etapa, nome: file.name || 'foto.jpg', progresso: 0, url: null, estado: 'preparando' };
  envios.push(tmp);
  desenharAnexos();
  var prep = foto ? prepararFoto(file) : Promise.resolve([file, null]);
  return prep.then(function (par) {
    item.blob = par[0]; item.mini = par[1];
    if (item.mini) tmp.url = URL.createObjectURL(item.mini);
    var limite = ((S.dados.regras && S.dados.regras.tamArquivoMB) || 25) * 1048576;
    if (item.blob.size > limite) throw { mensagem: 'O arquivo passa de ' + Math.round(limite / 1048576) + ' MB. Envie um link no follow-up.' };
    item.nome = foto ? String(file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg' : (file.name || 'arquivo');
    item.tipo = foto ? 'image/jpeg' : (file.type || 'application/octet-stream');
    if (!foto && !(item.blob instanceof Blob)) item.blob = new Blob([item.blob], { type: item.tipo });
    return filaGravar(item).then(function () { return enviarItem(item, tmp); });
  }).catch(function (e) {
    filaApagar(item.idCliente);
    tirarEnvio(idTarefa, tmp);
    avisar((e && e.mensagem) || (e && e.message === 'formato' ? 'Não deu para abrir esta foto. Tente tirar pela câmera ou escolher outra.' : 'Não foi possível enviar. Tente de novo.'), true);
    desenharAnexos();
    return { ok: false };
  });
}
function tirarEnvio(idTarefa, tmp) {
  S.envios[idTarefa] = (S.envios[idTarefa] || []).filter(function (x) { return x !== tmp; });
}
function enviarPartes(upload, parte, blob, tmp) {
  var tentar = function (inicio, falhas) {
    var pedaco = blob.slice(inicio, Math.min(blob.size, inicio + parte));
    return blobParaB64(pedaco).then(function (b64) { return api('tarefas.anexoParte', { upload: upload, inicio: inicio, dados: b64 }); })
      .then(function (r) {
        if (!r.ok) {
          if (r.codigo === 'REDE' && falhas < 3) return new Promise(function (ok) { setTimeout(ok, 2000 * (falhas + 1)); }).then(function () { return tentar(inicio, falhas + 1); });
          return r;
        }
        if (r.anexo) return r;
        tmp.progresso = Math.round((r.recebido / blob.size) * 100);
        desenharAnexos();
        return tentar(r.recebido, 0);
      });
  };
  return tentar(0, 0);
}

/* ---------- Escolher foto ou arquivo ---------- */
function escolherArquivos(tipo, aoEscolher) {
  var inp = document.createElement('input');
  inp.type = 'file';
  inp.style.display = 'none';
  if (tipo === 'camera') { inp.accept = 'image/*'; inp.setAttribute('capture', 'environment'); }
  else if (tipo === 'galeria') { inp.accept = 'image/*'; inp.multiple = true; }
  else inp.accept = '.pdf,.doc,.docx,.xls,.xlsx,.csv,.txt,.ppt,.pptx,.dwg,.zip,image/*';
  inp.addEventListener('change', function () {
    var fs = Array.prototype.slice.call(inp.files || []);
    document.body.removeChild(inp);
    if (fs.length) aoEscolher(fs);
  });
  document.body.appendChild(inp);
  inp.click();
}

var IDB = null;
function idb() {
  if (IDB) return IDB;
  IDB = new Promise(function (ok, erro) {
    if (!window.indexedDB) { erro(new Error('sem idb')); return; }
    var r = indexedDB.open('sindico-app', 1);
    r.onupgradeneeded = function () {
      var db = r.result;
      if (!db.objectStoreNames.contains('fila')) db.createObjectStore('fila', { keyPath: 'idCliente' });
      if (!db.objectStoreNames.contains('compartilhado')) db.createObjectStore('compartilhado', { keyPath: 'id' });
    };
    r.onsuccess = function () { ok(r.result); };
    r.onerror = function () { erro(r.error); };
  });
  IDB.catch(function () { IDB = null; });

}
function idbOp(loja, modo, fn) {
  return idb().then(function (db) {
    return new Promise(function (ok, erro) {
      var tx = db.transaction(loja, modo), q = fn(tx.objectStore(loja)), res;
      if (q) q.onsuccess = function () { res = q.result; };
      tx.oncomplete = function () { ok(res); };
      tx.onerror = function () { erro(tx.error); };
      tx.onabort = function () { erro(tx.error); };

}
function filaGravar(item) { return idbOp('fila', 'readwrite', function (st) { return st.put(item); }).catch(function () {}); }
function filaApagar(id) { return idbOp('fila', 'readwrite', function (st) { return st.delete(id); }).catch(function () {}); }
function filaTodos() { return idbOp('fila', 'readonly', function (st) { return st.getAll(); }).catch(function () { return []; }); }

/* Envia um item da fila. Sem sinal: fica guardado no aparelho e vai sozinho depois. */
function enviarItem(item, tmp) {

    idObs: item.idObs || '', origem: item.origem || 'app', idCliente: item.idCliente };
  return (item.mini ? blobParaB64(item.mini) : Promise.resolve('')).then(function (m64) {
    base.miniatura = m64;
    if (item.blob.size <= ANX_PARTE) {
      return blobParaB64(item.blob).then(function (b64) { base.dados = b64; return api('tarefas.anexoIniciar', base); });
    }
    return api('tarefas.anexoIniciar', base).then(function (r) {

    tmp.estado = 'aguardando'; tmp.progresso = 0;

    return r;
  }

  if (!r.ok) { avisar(r.mensagem, true); desenharAnexos(); return r; }
  var a = r.anexo;
  if (item.mini) { S.mini[a.id] = tmp.url || URL.createObjectURL(item.mini); cacheGravar('mini-' + a.id, item.mini); }
  if (foto) cacheGravar('arq-' + a.id, item.blob);
  if (S.det && S.det.id === item.idTarefa) {

  return r;
}

/* Tenta de novo tudo o que ficou na fila (ao abrir o app, ao voltar o sinal, ao voltar para o app). */
function processarFila() {
  if (S.filaRodando || !S.sessao || !S.dados || navigator.onLine === false) return;
  S.filaRodando = true;
  filaTodos().then(function (itens) {
    itens.sort(function (a, b) { return a.criadoEm - b.criadoEm; });
    var i = 0;
    var proximo = function () {
      if (i >= itens.length) { S.filaRodando = false; return; }
      var item = itens[i++];
      var lista = S.envios[item.idTarefa] || (S.envios[item.idTarefa] = []);
      var tmp = lista.filter(function (x) { return x.tmp === item.idCliente; })[0];
      if (tmp && tmp.estado === 'enviando') { proximo(); return; }
      if (!tmp) {
        tmp = { tmp: item.idCliente, etapa: item.etapa, nome: item.nome, progresso: 0, url: item.mini ? URL.createObjectURL(item.mini) : null, estado: 'aguardando' };
        lista.push(tmp);
      }
      enviarItem(item, tmp).then(function (r) {
        if (!r.ok && r.codigo === 'REDE') { S.filaRodando = false; return; }
        proximo();
      });
    };
    proximo();
  });
}
/* Ao abrir o app: mostra o que está guardado esperando sinal. */
function carregarFila() {
  filaTodos().then(function (itens) {
    if (!itens.length) return;
    itens.forEach(function (item) {
      var lista = S.envios[item.idTarefa] || (S.envios[item.idTarefa] = []);
      if (lista.some(function (x) { return x.tmp === item.idCliente; })) return;
      lista.push({ tmp: item.idCliente, etapa: item.etapa, nome: item.nome, progresso: 0, url: item.mini ? URL.createObjectURL(item.mini) : null, estado: 'aguardando' });
    });
    avisar(itens.length + (itens.length === 1 ? ' anexo aguardando envio' : ' anexos aguardando envio'));
    desenharAnexos();
    processarFila();
  });
}
window.addEventListener('online', function () { S.avisouFila = false; processarFila(); });

function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }

/* ================= Salvando: trava contra clique duplo ================= */
var emCurso = {};
/* Marca o botão (ou campo) como ocupado; a bolinha só aparece se demorar mais de 250 ms. Devolve a função que libera. */
function ocupar(el, texto) {
  if (!el || !el.classList) return function () {};
  var ehCampo = el.tagName === 'SELECT' || el.tagName === 'INPUT' || el.tagName === 'TEXTAREA';
  var antes = el.innerHTML, rot = null, timer = null;
  el.classList.add('ocupado'); el.setAttribute('aria-busy', 'true');
  if (ehCampo) {
    el.disabled = true;
    rot = el.id && document.querySelector('label[for="' + el.id + '"]');
    if (rot) rot.classList.add('salvando-rot');
  } else {
    if (texto && el.querySelector('span') && !el.classList.contains('edit-tit')) el.querySelector('span').textContent = texto;
    else if (texto && !el.querySelector('svg')) el.textContent = texto;
    timer = setTimeout(function () { el.classList.add('girando'); }, 250);
  }
  return function () {
    clearTimeout(timer);
    if (!document.body.contains(el)) return;
    el.classList.remove('ocupado', 'girando'); el.removeAttribute('aria-busy');
    if (ehCampo) { el.disabled = false; if (rot) rot.classList.remove('salvando-rot'); } else el.innerHTML = antes;
  };
}
/* Executa uma gravação uma vez só por vez (mesma chave = ignora o segundo toque). */
function umaVez(chave, el, texto, fazer) {
  if (emCurso[chave]) return Promise.resolve({ ok: false, ignorado: true });
  emCurso[chave] = true;
  var liberar = ocupar(el, texto);
  return Promise.resolve().then(fazer).then(function (r) { delete emCurso[chave]; liberar(); return r; },
    function (e) { delete emCurso[chave]; liberar(); throw e; });
}

  var lembrarDepois = (tl.nAntes || 0) > 0 && !(tl.nDepois || 0);

  abrirJanela('Concluir esta tarefa?', nomeCondo(t.condo) + ' · ' + t.id, h, 'centro', function (raiz) {

function concluir(id) {
  if (emCurso['concluir:' + id]) return;
  var t = (S.dados.tarefas || []).filter(function (x) { return x.id === id; })[0];

function trocarCondominio(cod) {
  var t = S.det; if (!t || cod === t.condo) return;
  var c = (t.condosParaTrocar || []).filter(function (x) { return x.codigo === cod; })[0];
  if (!c) return;
  var emps = c.empresas || [];

      if (r.ignorado) return;
      if (!r.ok) { avisar(r.mensagem, true); desenharDetalhe(); return; }
      if (r.semMudanca || !r.tarefa) { abrirTarefa(t.id, true); return; }
      S.condo = cod;
      avisar('Tarefa movida para ' + c.nome + ' · novo nº ' + r.tarefa.id);
      recarregar();
      abrirTarefa(r.tarefa.id);
    });
  };
  if (emps.indexOf(t.empresa) >= 0) { enviar(t.empresa); return; }
  if (emps.length === 1) { enviar(emps[0]); return; }

  var h = '<div class="jan-corpo"><p class="desc">A empresa ' + esc(t.empresa) + ' não atende ' + esc(c.nome) + '. Escolha a empresa da tarefa lá:</p>' +

}

function linkDe(id) { return location.origin + location.pathname + '?t=' + encodeURIComponent(id); }

/* Segurar o cartão: iOS não dispara contextmenu, então há um temporizador de toque; Android e computador usam contextmenu. */
var segurar = { timer: null, x: 0, y: 0, ultimo: 0, ignorarClique: false };
function cartaoIdDe(el) { var c = el && el.closest && el.closest('.cartao'); return c ? c.getAttribute('data-id') : null; }

  segurar.ultimo = Date.now(); segurar.ignorarClique = true;

  abrirOpcoes(id, false);
}
document.addEventListener('touchstart', function (e) {
  var id = cartaoIdDe(e.target); if (!id || e.target.closest('.concluir')) return;
  var p = e.touches[0]; segurar.x = p.clientX; segurar.y = p.clientY;
  clearTimeout(segurar.timer);
  segurar.timer = setTimeout(function () { dispararSegurar(id); }, 550);
}, { passive: true });
document.addEventListener('touchmove', function (e) {
  var p = e.touches[0];
  if (Math.abs(p.clientX - segurar.x) > 10 || Math.abs(p.clientY - segurar.y) > 10) clearTimeout(segurar.timer);
}, { passive: true });
document.addEventListener('touchend', function () { clearTimeout(segurar.timer); }, { passive: true });
document.addEventListener('touchcancel', function () { clearTimeout(segurar.timer); }, { passive: true });
document.addEventListener('contextmenu', function (e) {
  var id = cartaoIdDe(e.target); if (!id) return;
  var t = tarefaPorId(id); if (!t || !podeCompartilhar(t.condo)) return;
  e.preventDefault(); clearTimeout(segurar.timer); dispararSegurar(id);
});

/* Regra do portal: aviso que pede ação traz o botão com o nome da ação e leva direto à tela certa. */
function avisosPortal() { return (S.portal && S.portal.avisos) || []; }
function desenharSino() {
  var al = ((S.dados && S.dados.alertas) || []).filter(function (a) { return !a.lido; });
  var n = al.length + avisosPortal().filter(function (a) { return !a.lido; }).length;
  var selo = $('seloSino');
  selo.hidden = !n; selo.textContent = n;
  $('btSino').setAttribute('aria-label', n ? 'Avisos: ' + n + ' novos' : 'Avisos');
}
var NOMES_ALERTA = { URGENTE_PARADA: 'Urgente parada', NOVA: 'Tarefa nova', CADASTRO: 'Cadastro aguardando aprovação' };
function abrirSino() {
  var al = (S.dados && S.dados.alertas) || [];
  var av = avisosPortal();
  var porId = {};
  ((S.dados && S.dados.tarefas) || []).forEach(function (t) { porId[t.id] = t; });
  var h = '<div class="menu-cab"><b>Avisos</b></div>';
  if (!al.length && !av.length) h += '<div class="menu-vazio">Nenhum aviso por enquanto.</div>';
  av.forEach(function (a) {
    h += '<div class="av-item"><span class="av-tipo' + (a.acao ? '' : ' info') + '">' + esc(a.titulo) + '</span>' +
      '<span class="av-txt' + (a.lido ? '' : ' novo') + '">' + esc(a.texto) + '</span>' +
      (a.acao ? '<button class="av-bt" data-aviso-acao="' + esc(a.acao.tipo) + '" data-aviso-ref="' + esc(a.acao.ref) + '">' + esc(a.acao.rotulo) + '</button>' : '') + '</div>';
  });
  al.forEach(function (a) {
    var t = porId[a.tarefa];
    h += '<div class="av-item"><span class="av-tipo">' + esc(NOMES_ALERTA[a.tipo] || a.tipo) + '</span>' +
      '<span class="av-txt' + (a.lido ? '' : ' novo') + '">' + esc(t ? t.titulo : a.tarefa) + '</span>' +

  });

      var b = e.target.closest('[data-alerta]');
      if (b) { fecharCamadas(); abrirTarefa(b.getAttribute('data-alerta')); return; }
      var p = e.target.closest('[data-aviso-acao]');
      if (p) { fecharCamadas(); executarAviso(p.getAttribute('data-aviso-acao'), p.getAttribute('data-aviso-ref')); }
    });

function executarAviso(tipo, ref) {

  else if (tipo === 'evolucao') abrirEvolucao();
  else if (tipo === 'equipe') abrirEquipe(ref);

    var av = avisosPortal().filter(function (a) { return a.id === 'S-' + ref; })[0];
    if (av && !av.lido && av.acao && av.acao.rotulo !== 'Responder') { av.lido = true; desenharSino(); api('portal.lerAvisos', { ids: [av.id] }); }

function lerAlertasDa(idTarefa) {
  var ids = (S.dados.alertas || []).filter(function (a) { return a.tarefa === idTarefa && !a.lido; }).map(function (a) { return a.id; });

  S.dados.alertas.forEach(function (a) { if (ids.indexOf(a.id) >= 0) a.lido = true; });

var PUSH = { prompt: null, verificado: false, ouvindo: false };

function plataforma() {

function obterTokenPush(forcar) {

    return (window.firebase && firebase.messaging ? Promise.resolve() : carregarScript(FB_SDK + 'firebase-app-compat.js').then(function () {

    return api('portal.registrarPush', { token: tok, plataforma: plataforma() + (instalado() ? ' · app instalado' : '') }).then(function (r) {

  if (/^(gal[aã]o)$/.test(x)) return 'galão';

function criarTarefa(raiz, condo, confirmar, opcoes, categoria) {

    fecharCamadas();

    if (nova && podeCompartilhar(nova.condo)) {

      avisar('Tarefa criada', false, { rotulo: 'Compartilhar', seg: 7, fn: function () { compartilharCriada(); } });
    } else avisar('Tarefa criada');
    if (S.condo !== 'todos' && S.condo !== condo) S.condo = condo;
    if (nova && opcoes.aoCriar) {
      S.dados.tarefas = (S.dados.tarefas || []).concat([nova]);
      opcoes.aoCriar(nova);
    }
    recarregar();
  });
}

function ligarMicrofone(bt, campo) {
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  bt.addEventListener('click', function () {
    if (rec) { rec.stop(); return; }
    rec = new Rec();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.maxAlternatives = 1;
    var base = campo.value ? campo.value.trim() + ' ' : '';
    bt.classList.add('ouvindo'); bt.setAttribute('aria-label', 'Parar de ditar');
    rec.onresult = function (e) {
      var txt = '';
      for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      campo.value = (base + txt).slice(0, 120);
    };
    rec.onend = rec.onerror = function () {
      bt.classList.remove('ouvindo'); bt.setAttribute('aria-label', 'Ditar o título'); rec = null;
    };
    rec.start();
  });
}

        '<p class="cartao-meta" style="margin:0">' + esc(s.id) + (s.tela ? ' · tela: ' + esc(s.tela) : '') + (s.idTarefa ? ' · ' + esc(s.idTarefa) : '') + '</p>' +
        (E.modo ? evoCompositor(s) : '<div class="evo-acoes">' + evoBotoes(s, E.aba) + '</div>') + '</div>';
    }
    h += '</article>';
  });
  $('evo').innerHTML = h + '</div>';
  var ta = $('evoTxt'); if (ta && E.modo) ta.focus();
}
function evoItem(id) {
  var achado = null;
  Object.keys(E.dados.abas).forEach(function (k) { E.dados.abas[k].forEach(function (s) { if (s.id === id) achado = s; }); });
  return achado;
}
function cliqueEvolucao(ev) {
  var b = ev.target.closest('button'); if (!b || !E) return;
  if (b.hasAttribute('data-evoaba')) { E.aba = b.getAttribute('data-evoaba'); E.aberto = null; E.modo = null; desenharEvolucao(); return; }
  if (b.hasAttribute('data-evoabrir')) { var id = b.getAttribute('data-evoabrir'); E.aberto = E.aberto === id ? null : id; E.modo = null; desenharEvolucao(); return; }
  var a = b.getAttribute('data-evo'); if (!a) return;
  if (a === 'cancelar') { E.modo = null; desenharEvolucao(); return; }
  if (a !== 'confirmar') { E.modo = a; desenharEvolucao(); return; }
  var s = evoItem(E.aberto); if (!s || E.ocupado) return;
  var txt = $('evoTxt') ? $('evoTxt').value.trim() : '';
  var m = E.modo, chamada;
  if (m === 'aprovar' || m === 'planejar' || m === 'recusar') chamada = api('evolucao.decidir', { id: s.id, decisao: m, mensagem: txt });
  else if (m === 'perguntar') { if (!txt) { avisar('Escreva a pergunta.', true); return; } chamada = api('evolucao.perguntar', { id: s.id, pergunta: txt }); }
  else if (m === 'conversar') { if (!txt) { avisar('Escreva o que o agente deve considerar.', true); return; } chamada = api('evolucao.pedirAgente', { id: s.id, tipo: 'conversar', texto: txt }); }
  else if (m === 'implementar') chamada = api('evolucao.pedirAgente', { id: s.id, tipo: 'implementar', texto: txt });
  else if (m === 'noAr') chamada = api('evolucao.noAr', { id: s.id });
  E.ocupado = true; desenharEvolucao();
  chamada.then(function (r) {
    E.ocupado = false;
    if (!r.ok) { avisar(r.mensagem, true); desenharEvolucao(); return; }
    var msg = { aprovar: 'Sugestão aprovada', planejar: 'Sugestão planejada', recusar: 'Sugestão recusada', perguntar: 'Pergunta enviada',
      conversar: 'Pedido enviado ao agente', implementar: 'Pedido enviado ao agente', noAr: 'Marcada como no ar' }[m];
    if (r.avisado) msg += ' · ' + primeiro(s.autorNome) + ' foi avisado';
    avisar(msg);
    E.modo = null; E.aberto = null;
    carregarEvolucao();
  }, function () { E.ocupado = false; desenharEvolucao(); });
}

/* ================= Camadas (janelas, menus, avisos) ================= */
function fecharCamadas() { $('camadas').innerHTML = ''; document.body.classList.remove('janela-aberta'); document.removeEventListener('keydown', escFecha); }
function escFecha(e) { if (e.key === 'Escape') { if (S.visor) fecharVisor(); else fecharCamadas(); } }
function abrirJanela(titulo, sub, corpoHtml, tipo, montar, semFundoNoComputador) {
  var fundo = (semFundoNoComputador && faixa() === 'computador') ? '' : '<div class="fundo" data-acao="fecharJan"></div>';
  $('camadas').innerHTML = fundo + '<section class="janela ' + tipo + '" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '">' +
    '<div class="jan-cab"><span class="alca" aria-hidden="true"></span><div><b>' + esc(titulo) + '</b><small>' + esc(sub) + '</small></div>' +

var avisoTimer = null;
function avisar(texto, erro, acao) {

  area.innerHTML = '<div class="aviso' + (erro ? ' erro' : '') + '" role="status"><span>' + esc(texto || 'Algo deu errado. Tente de novo.') + '</span>' +

/* ================= Eventos ================= */
document.addEventListener('click', function (e) {
  if (segurar.ignorarClique && cartaoIdDe(e.target)) { segurar.ignorarClique = false; e.preventDefault(); return; }
  segurar.ignorarClique = false;

  if (b.hasAttribute('data-verfoto')) { abrirFoto(b.getAttribute('data-verfoto')); return; }
  if (b.hasAttribute('data-baixar')) { abrirDocumento(b.getAttribute('data-baixar')); return; }
  if (b.hasAttribute('data-excluiranx')) { confirmarExcluirAnexo(b.getAttribute('data-excluiranx'), b); return; }

  if (b.hasAttribute('data-mover')) { acaoDetalhe('mover', { direcao: b.getAttribute('data-mover') }, null, b); return; }
  if (b.hasAttribute('data-excluirobs')) {
    var idObs = b.getAttribute('data-excluirobs');

      if (!r.ok) avisar(r.mensagem, true);

    });

  }
  if (acao && /^cp[A-Z]/.test(acao)) { acaoCompra(acao, b); return; }
  if (acao && /^pd[A-Z]/.test(acao)) { acaoPedido(acao, b); return; }
  switch (acao) {
    case 'fecharJan': fecharCamadas(); break;
    case 'convidar': fecharCamadas(); abrirConvidar(); break;
    case 'pessoas': fecharCamadas(); abrirGestao(); break;
    case 'evolucao': fecharCamadas(); abrirEvolucao(); break;
    case 'ressarcimentos': fecharCamadas(); abrirRessarcimentos(); break;

    case 'fecharFaixaGuia': guardarLocal('faixaGuiaFechada', hojeLocal()); desenharFaixaGuia(); break;
    case 'pedidos': fecharCamadas(); abrirPedidos(); break;
    case 'trocarConta': trocarConta(); break;
    case 'verificarPedido': verificarPedido(b); break;
    case 'fecharDet': fecharDetalhe(); break;
    case 'nova': abrirNova(); break;
    case 'sugerir': abrirSugestao(); break;
    case 'topo': fecharDetalhe(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
    case 'sair': fecharCamadas(); sair(); break;
    case 'atualizar': fecharCamadas(); recarregar().then(function () { avisar('Lista atualizada'); }); break;
    case 'urgente': marcarUrgente(); break;
    case 'concluirDet': confirmarConcluir(S.det.id); break;
    case 'reabrir': acaoDetalhe('reabrir', {}, function () { avisar('Tarefa reaberta'); invalidarConcluidas(); if (S.visao === 'concluidas') carregarConcluidas(); }, b, 'Reabrindo…'); break;
    case 'alternarGrupos': alternarGrupos(); break;
    case 'clipObs': abrirAnexar('Antes', 'obs'); break;
    case 'tentarFila': S.avisouFila = false; processarFila(); break;
    case 'tirarClip': if (S.det) { delete S.anexoObs[S.det.id]; desenharDetalhe(); } break;
    case 'concPeriodo': abrirPeriodo(); break;
    case 'concMais': carregarConcluidas(true); break;
    case 'enviarObs': enviarObs(); break;
    case 'editarTitulo': S.editandoTitulo = true; desenharDetalhe(); var it = $('txtTitulo'); it.focus(); it.select(); break;
    case 'cancelarTitulo': S.editandoTitulo = false; desenharDetalhe(); break;
    case 'salvarTitulo': salvarTitulo(); break;
    case 'compartDet': if (S.det) compartilhar(S.det.id); break;
    case 'editarDesc': S.editandoDesc = true; desenharDetalhe(); $('txtDesc').focus(); break;
    case 'cancelarDesc': S.editandoDesc = false; desenharDetalhe(); break;
    case 'salvarDesc':
      var txt = $('txtDesc').value;
      acaoDetalhe('descricao', { texto: txt, versao: S.det.versao }, function () { S.editandoDesc = false; avisar('Descrição salva'); }, b);
      break;
  }
  if (b.id === 'btSino') abrirSino();
  if (b.id === 'btMarca') abrirMenuPortal();

});

/* ================= Ressarcimentos (v1.20): início, nova NF, deslocamento, revisão e acompanhamento ================= */
/* Só o master (decisão de 24/11/2026). Regras: skill ressarcimentos-carvalho-abreu e doc de diretrizes.
   O app monta o nome do arquivo; nada sai sem "Aprovar e enviar". */
var RS = null;
var RS_ABAS = [{ id: 'inicio', rot: 'Início' }, { id: 'nf', rot: 'Nova NF' }, { id: 'desl', rot: 'Deslocamento' }, { id: 'rev', rot: 'Revisão' }, { id: 'acomp', rot: 'Acompanhamento' }];
var RS_CASO = {
  AS: 'NF para arquivo', AD: 'NF para arquivo + deslocamento', RS: 'Compra a ressarcir', RD: 'Compra a ressarcir + deslocamento',
  FATURADO: 'Retirada de material faturado', 'REUNIÃO': 'Reunião ou visita'
};
var RS_PASSOS = ['Motivo', 'Condomínios', 'Destino', 'Conferir'];

function temRess() { return ((S.portal && S.portal.modulos) || []).some(function (m) { return m.id === 'ressarcimentos'; }); }
function rsBadge() { return (S.rsResumo && S.rsResumo.emRevisao) || 0; }
function rsAtualizarResumo() {
  if (!temRess() || S.rsPedindo) return;
  S.rsPedindo = true;
  api('ressarcimentos.resumo').then(function (r) {
    S.rsPedindo = false;
    if (r && r.ok) { S.rsResumo = r; desenharLateralGestao(); if (RS && RS.aba === 'inicio' && $('rs')) rsDesenhar(); }
  }).catch(function () { S.rsPedindo = false; });
}
function rsHoje() { return diaSP(new Date()); }
function rsMoeda(v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function rsNum(txt) {
  var s = String(txt == null ? '' : txt).replace(/[^\d,.-]/g, '');
  if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
  var n = parseFloat(s);
  return isNaN(n) ? null : Math.round(n * 100) / 100;
}
function rsData(iso) { if (!iso) return ''; var p = String(iso).slice(0, 10).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; }
function rsSemAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim(); }
function rsCondo(cod) { return ((RS && RS.cfg && RS.cfg.condominios) || []).filter(function (c) { return c.codigo === cod; })[0] || null; }
function rsNomeCondo(cod) { var c = rsCondo(cod); return c ? c.nome : nomeCondo(cod); }
function rsForn(ap) { return ((RS && RS.cfg && RS.cfg.fornecedores) || []).filter(function (f) { return f.apelido === ap; })[0] || null; }
function rsDrive(id) { return 'https://drive.google.com/file/d/' + encodeURIComponent(id) + '/view'; }
function rsNovaNF() { return { arq: null, ra: 'R', ds: 'D', codigo: '', loja: '', tipo: 'NF', valor: '', numero: '', data: rsHoje(), desc: '', comps: [] }; }
function rsNovoDesl() { return { motivo: 'FATURADO', sel: {}, modo: 'cad', forn: '', busca: '', outro: { nome: '', endereco: '', bairro: '', cidade: 'São José dos Campos - SP', cep: '', salvar: true }, data: rsHoje(), desc: '', comps: [], passo: 1 }; }

function abrirRessarcimentos(aba) {
  if (!(S.portal && S.portal.usuario && S.portal.usuario.master) || !temRess()) return;
  RS = { aba: aba || 'inicio', cfg: null, rev: null, acomp: null, verAcomp: 'abertos', aberto: null, confTodos: false, baixa: null,
    nf: rsNovaNF(), d: rsNovoDesl(), ocupado: '', entradaInfo: false };
  abrirJanela('Ressarcimentos', 'Carregando…', '<div class="rs" id="rs"><p class="vazio">Carregando…</p></div>', 'gestao', function (raiz) {
    raiz.addEventListener('click', cliqueRess);
    raiz.addEventListener('input', entradaRess);
    raiz.addEventListener('change', mudancaRess);
    Promise.all([api('ressarcimentos.config'), api('ressarcimentos.resumo')]).then(function (rr) {
      if (!$('rs')) return;

      RS.cfg = rr[0];
      RS.cfg.fornecedores.sort(function (a, b) { return a.apelido < b.apelido ? -1 : 1; });
      if (rr[1].ok) { S.rsResumo = rr[1]; desenharLateralGestao(); }
      rsIrAba(RS.aba);
    }).catch(function () {});
  });
}
function rsIrAba(aba) {
  RS.aba = aba; RS.aberto = null; RS.confTodos = false; RS.baixa = null; RS.entradaInfo = false;
  rsDesenhar();

function rsCarregarRev() {
  return api('ressarcimentos.revisao').then(function (r) {

    if (RS.aba === 'rev' && $('rs')) rsDesenhar();

function rsCarregarAcomp() {
  return api('ressarcimentos.acompanhamento').then(function (r) {

    if (RS.aba === 'acomp' && $('rs')) rsDesenhar();

}

      h += '<tr><td style="color:var(--suave2)">' + esc(rsBatDia(g.credito.data)) + '</td><td>' + esc(g.credito.condominio) + '</td><td class="dir">' + esc(rsMoeda(g.credito.valor)) + '</td>' +
        '<td class="numdoc">' + esc(g.item.numDoc || g.item.descricao) + '</td><td style="color:var(--suave2)">' + esc(rsData(g.item.enviadoEm)) + '</td><td>' +
        (f[k] ? '<span class="rs-selo verde">Concluído</span>' : '<button class="bt claro" data-rs="batBaixa" data-rsk="' + k + '" style="min-height:2.5em;font-size:.8125em">Dar baixa</button>') + '</td></tr>';
    });
    h += '</tbody></table></div></section>';
  }
  if (r.somas.length || r.escolher.length) {
    h += '<section class="rs-bat-sec"><h3>Confirmar</h3><div class="rs-bat-grade">';
    r.somas.forEach(function (g, i) {
      var k = 's:' + i, st = f[k];
      h += '<div class="rs-bat-card' + (st === 'ok' ? ' ok' : st ? ' neutro' : '') + '"><div class="lin"><b>' + esc(g.credito.condominio) + '</b><span class="vl">' + esc(rsMoeda(g.credito.valor)) + '</span></div>' +
        '<span class="cartao-meta">PIX em ' + esc(rsBatDia(g.credito.data)) + ' · um depósito, soma exata de ' + g.itens.length + ' notas</span>' + rsBatLinhas(g.itens) +
        (st ? '<span class="rs-selo ' + (st === 'ok' ? 'verde' : 'azul') + '" style="align-self:flex-start">' + (st === 'ok' ? g.itens.length + ' notas concluídas' : 'Continua em aberto') + '</span>'
          : '<div class="rs-bat-acoes"><button class="bt" data-rs="batSoma" data-rsk="' + k + '">Confirmar baixa das ' + g.itens.length + '</button><button class="bt claro" data-rs="batNao" data-rsk="' + k + '">Não é isso</button></div>') + '</div>';
    });
    r.escolher.forEach(function (g, i) {
      var k = 'e:' + i, st = f[k];
      h += '<div class="rs-bat-card' + (st === 'ok' ? ' ok' : st ? ' neutro' : '') + '"><div class="lin"><b>' + esc(g.credito.condominio) + '</b><span class="vl">' + esc(rsMoeda(g.credito.valor)) + '</span></div>' +
        '<span class="cartao-meta">PIX em ' + esc(rsBatDia(g.credito.data)) + ' · ' + g.opcoes.length + ' notas com esse valor. Qual foi paga?</span>' +
        (st ? '<span class="rs-selo ' + (st === 'ok' ? 'verde' : 'azul') + '" style="align-self:flex-start">' + (st === 'ok' ? 'Baixada' : 'Continua em aberto') + '</span>'
          : '<div class="rs-bat-acoes">' + g.opcoes.map(function (o, j) { return '<button class="bt claro" data-rs="batEscolha" data-rsk="' + k + ':' + j + '">' + esc(o.numDoc || o.descricao) + '</button>'; }).join('') +
            '<button class="bt-link" data-rs="batNao" data-rsk="' + k + '">Nenhuma</button></div>') + '</div>';
    });
    h += '</div></section>';
  }
  if (r.semNota.length) {
    h += '<section class="rs-bat-sec"><h3>Crédito de condomínio sem nota em aberto</h3><div class="rs-bat-grade">';
    r.semNota.forEach(function (g, i) {
      var k = 'n:' + i, st = f[k], sug = g.sugestao;
      h += '<div class="rs-bat-card neutro' + (st === 'ok' ? ' ok' : '') + '"><div class="lin"><b>' + esc(g.credito.condominio + ' · ' + rsBatDia(g.credito.data)) + '</b><span class="vl">' + esc(rsMoeda(g.credito.valor)) + '</span></div>' +
        '<span class="cartao-meta">' + esc(g.credito.pagador) + '</span>' +
        (sug ? '<span style="font-size:.875em;line-height:1.5;color:var(--suave2)">Bate com lançamentos já concluídos sem data de recebimento:</span>' + rsBatLinhas(sug) : '<span style="font-size:.875em;color:var(--suave2)">Não bate com nada enviado nem com a soma de lançamentos.</span>') +
        (st ? '<span class="rs-selo ' + (st === 'ok' ? 'verde' : 'azul') + '" style="align-self:flex-start">' + (st === 'ok' ? 'Recebimento registrado' : 'Ignorado') + '</span>'
          : '<div class="rs-bat-acoes">' + (sug ? '<button class="bt" data-rs="batSug" data-rsk="' + k + '">Registrar recebimento</button>' : '') +
            '<button class="bt claro" data-rs="batIgnorar" data-rsk="' + k + '">Não é ressarcimento</button></div>') + '</div>';
    });
    h += '</div></section>';
  }
  var mais = r.jaBaixados.map(function (g) { return { c: g.credito, t: 'já baixado (' + g.itens.map(function (x) { return x.numDoc || x.descricao; }).join(', ') + ')' }; })
    .concat(r.antes.map(function (g) { return { c: g.credito, t: 'antes dos envios em aberto' }; }));
  if (mais.length) h += '<details class="rs-bat-mais"><summary>' + mais.length + (mais.length === 1 ? ' crédito que não entra' : ' créditos que não entram') + ' no batimento</summary><ul>' +
    mais.map(function (m) { return '<li><span>' + esc(rsBatDia(m.c.data) + ' · ' + m.c.condominio + ' · ' + m.t) + '</span><span>' + esc(rsMoeda(m.c.valor)) + '</span></li>'; }).join('') + '</ul></details>';
  if (!r.bateu.length && !r.somas.length && !r.escolher.length && !r.semNota.length) h += '<p class="vazio">Nenhum crédito novo para baixar neste extrato.</p>';
  return h + '<div class="rs-info">Regra: mesmo condomínio (pelo CNPJ do PIX), mesmo valor e crédito no dia do envio ou depois. PIX de pessoas e débitos ficam de fora.</div>';
}

function carregarScriptGoogle() {
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
  document.head.appendChild(s);
}
function iniciar() {
  try {
    var qsC = new URLSearchParams(location.search);
    if (qsC.get('compartilhado')) { guardar('compartilhado', '1'); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=3', { scope: './' }).catch(function () {});
  lerConviteUrl();
  guardarLinkDireto();
  S.sessao = ler('sessao');
  try { S.google = JSON.parse(ler('google') || 'null'); } catch (e) { S.google = null; }
  if (S.sessao) {
    $('entradaTexto').textContent = 'Abrindo…';
    recarregar(); // a casca abre assim que o portal e as tarefas chegam
  }
  chamar({ fn: 'config' }).then(function (c) {
    if (!c.ok || !c.clientId) { if (!S.sessao) mostrarEntrada(c.mensagem || 'Não foi possível carregar o aplicativo. Tente de novo em instantes.'); return; }
    S.cfg = c;
    carregarScriptGoogle();
    verificarPush();
    if (!S.sessao) mostrarEntrada();
  });
}
iniciar();
})();
</script>
