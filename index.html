<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Síndico · Carvalho &amp; Abreu</title>
<script>try{if(localStorage.getItem('lateral')==='recolhida')document.documentElement.setAttribute('data-lateral','recolhida')}catch(e){}</script>
<meta name="description" content="Portal da Carvalho & Abreu Sindicância Profissional.">
<meta name="theme-color" content="#0F2646">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Síndico">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0F2646; --azul2:#16325C; --ouro:#C9A46A; --ouro-claro:#E3C894; --ouro-fundo:#F3E6CC;
  --creme:#F8F4EC; --creme2:#F1EBDD; --linha:#E2DACA; --linha2:#ECE5D6;
  --texto:#1E2B45; --suave:#5C6680; --suave2:#3D4863; --vinho:#8A2E2E; --vinho-fundo:#F6E9E6;
  --sombra:0 1px 6px rgba(15,38,70,.05); --sombra-alta:0 12px 36px rgba(15,38,70,.22);
  --topo-seg:env(safe-area-inset-top,0px); --baixo-seg:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--creme);color:var(--texto);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.serif{font-family:Lora,Georgia,serif}
:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}

/* ---------- Entrada ---------- */
#entrada{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(24px + var(--topo-seg)) 20px calc(24px + var(--baixo-seg))}
.entrada-caixa{width:100%;max-width:400px;background:#fff;border-radius:20px;box-shadow:var(--sombra-alta);overflow:hidden;text-align:center}
.entrada-topo{background:var(--azul);padding:28px 24px 22px;border-bottom:3px solid var(--ouro)}
.entrada-topo img{width:88px;height:88px;border-radius:50%;background:#fff;border:3px solid var(--ouro)}
.entrada-topo h1{margin:12px 0 2px;color:#fff;font-size:1.75rem}
.entrada-topo p{margin:0;color:var(--ouro-claro);font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.entrada-corpo{padding:26px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.entrada-corpo p{margin:0;color:var(--suave);font-size:.95rem}
#botaoGoogle{min-height:44px;display:flex;justify-content:center}
.entrada-msg{font-size:.9rem;color:var(--vinho);background:var(--vinho-fundo);border-radius:10px;padding:10px 12px;width:100%}
.entrada-rodape{padding:0 24px 18px;font-size:.8rem}
.entrada-rodape a{color:var(--suave)}

/* ---------- Casca ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topo{background:#fff;border-bottom:1px solid var(--linha2);padding:calc(.75em + var(--topo-seg)) 1.75em .75em;display:flex;align-items:center;gap:1.25em;position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:.75em;flex:1 1 auto;min-width:0}
.marca img{width:2.5em;height:2.5em;border-radius:50%;border:2px solid var(--ouro);background:#fff;flex:none}
.marca-nomes{display:flex;align-items:baseline;gap:.6em;flex-wrap:wrap;min-width:0}
.marca-nome{font-family:Lora,Georgia,serif;font-weight:700;font-size:1.375em;color:var(--azul);line-height:1.1}
.marca-sub{font-size:.75em;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#6B5A3A}
.telas{display:flex;align-items:center;gap:.5em}
.telas span{font-size:.8125em;color:var(--suave)}
.telas-grupo{display:flex;background:var(--creme2);border-radius:.75em;padding:.25em;gap:.25em}
.telas-grupo button{min-height:2.25em;padding:0 .8em;border-radius:.55em;border:none;background:transparent;color:var(--suave2);font-size:.8125em;font-weight:600}
.telas-grupo button[aria-pressed="true"]{background:var(--azul);color:#fff}
.icone-bt{position:relative;width:2.75em;height:2.75em;border-radius:50%;border:1px solid var(--linha);background:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.selo{position:absolute;top:-.2em;right:-.2em;min-width:1.25em;height:1.25em;border-radius:999px;background:var(--vinho);color:#fff;font-size:.6875em;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .3em}
.perfil{display:flex;align-items:center;gap:.6em;background:none;border:none;padding:.25em;border-radius:999px;text-align:left}
.avatar{width:2.5em;height:2.5em;border-radius:50%;background:var(--creme2);color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.875em;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.perfil-txt{display:flex;flex-direction:column;line-height:1.25}
.perfil-txt b{font-size:.875em;font-weight:600;color:var(--azul)}
.perfil-txt small{font-size:.75em;color:var(--suave)}

.corpo{display:flex;flex:1;min-height:0}
.lateral{flex:none;width:15em;background:var(--azul);color:#fff;padding:1.5em .875em;display:flex;flex-direction:column;gap:.25em}
.lat-titulo{font-size:.6875em;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ouro);padding:0 .9em .6em}
.lat-titulo.cinza{color:#8C99B3;padding-top:1.6em}
.lat-item{display:flex;align-items:center;gap:.75em;min-height:2.75em;padding:0 .9em;border-radius:.75em;color:#fff;text-decoration:none;font-weight:600;font-size:.9375em;background:none;border:none;width:100%;text-align:left}
.lat-item[aria-current="page"]{background:rgba(201,164,106,.18)}
.lat-item .cont{min-width:1.6em;height:1.6em;border-radius:999px;background:var(--ouro);color:var(--azul);font-size:.8em;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 .4em}
.lat-breve{display:flex;align-items:center;gap:.75em;min-height:2.4em;padding:0 .9em;color:#A9B4C9;font-size:.9375em}
.lat-breve i{width:.5em;height:.5em;border-radius:50%;border:1.5px solid #6B7A99;flex:none}
.lat-esp{flex:1;min-height:1.5em}
.lat-rodape{font-size:.75em;color:#8C99B3;padding:.6em .9em 0}
.lat-rodape a{color:#A9B4C9}

.coluna-icones{display:none}
.principal{flex:1;min-width:0;padding:1.75em 2em 2.5em;display:flex;flex-direction:column;gap:1.25em}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:1em 1.5em}
.cab h1{margin:0;font-family:Lora,Georgia,serif;font-weight:700;font-size:1.75em;color:var(--azul)}
.abas{display:flex;gap:.25em;flex:1 1 auto}
.abas button{min-height:2.75em;padding:0 1em;border:none;background:none;border-bottom:3px solid transparent;color:var(--suave);font-weight:500;font-size:.9375em}
.abas button[aria-selected="true"]{border-bottom-color:var(--ouro);color:var(--azul);font-weight:700}
.bt{min-height:2.75em;padding:0 1.25em;border-radius:.75em;border:none;background:var(--azul);color:#fff;font-weight:600;font-size:.9375em;display:inline-flex;align-items:center;justify-content:center;gap:.5em}
.bt.claro{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.ocupado{pointer-events:none;opacity:.72;-webkit-user-select:none;user-select:none}
.ocupado.girando::before{content:"";width:1em;height:1em;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:gira .7s linear infinite;flex:none}
.ocupado.girando svg{display:none}
@keyframes gira{to{transform:rotate(360deg)}}
.salvando-rot::after{content:" · Salvando…";font-weight:500;color:var(--ouro2,#9C7A3C);text-transform:none;letter-spacing:0}
.conf-tit{margin:0;font-family:Lora,Georgia,serif;font-weight:700;font-size:1.125em;line-height:1.3;color:var(--azul);overflow-wrap:anywhere}
.conf-rodape{display:flex;gap:.75em;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:767px){.conf-rodape{flex-direction:column-reverse}.conf-rodape .bt{width:100%}}
.bt.ouro{background:#fff;color:var(--azul);border:1.5px solid var(--ouro)}
.bt.grande{min-height:3.25em;border-radius:.875em;font-weight:700;font-size:1em;width:100%}
.bt:disabled{opacity:.55;cursor:default}
.bt-link{background:none;border:none;padding:.4em 0;color:var(--azul);font-weight:600;font-size:.875em;text-decoration:underline;text-decoration-color:var(--ouro);text-underline-offset:3px}

.condos{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.chip{min-height:2.75em;display:inline-flex;align-items:center;gap:.5em;padding:0 .875em 0 1.1em;border-radius:999px;font-size:.9375em;font-weight:600;background:#fff;color:var(--azul);border:2px solid var(--linha);white-space:nowrap;flex:none}
.chip .n{min-width:1.5em;height:1.5em;padding:0 .4em;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:.8125em;font-weight:700;background:var(--creme2);color:var(--azul)}
.chip[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
.chip[aria-pressed="true"] .n{background:var(--ouro)}
.outros{min-height:2.75em;border-radius:999px;border:2px dashed var(--linha);background:#fff;color:var(--azul);font-weight:600;font-size:.9375em;padding:0 1em}
/* v1.23: faixa de categorias (44 px, contador, ponto de urgente, esmaecido na borda) */
.cats{position:relative;margin:0 -.25em}
.cats-rolo{display:flex;gap:.5em;overflow-x:auto;scrollbar-width:none;padding:.15em .25em .35em;-webkit-overflow-scrolling:touch}
.cats-rolo::-webkit-scrollbar{display:none}
.cats::after{content:"";position:absolute;top:0;bottom:.35em;right:0;width:2.5em;pointer-events:none;background:linear-gradient(90deg,rgba(248,244,236,0),var(--creme,#F8F4EC));transition:opacity .15s}
.cats::before{content:"";position:absolute;top:0;bottom:.35em;left:0;width:1.5em;pointer-events:none;background:linear-gradient(270deg,rgba(248,244,236,0),var(--creme,#F8F4EC));opacity:0;transition:opacity .15s;z-index:1}
.cats.fim::after{opacity:0}
.cats.ini::before{opacity:1}
.cat-b{position:relative;min-height:2.75em;display:inline-flex;align-items:center;gap:.45em;padding:0 .85em 0 .7em;border-radius:.75em;font-size:.9375em;font-weight:600;background:#fff;color:var(--azul);border:1.5px solid var(--linha);white-space:nowrap;flex:none}
.cat-b .ci{display:flex;color:#7A5C27}
.cat-b .n{min-width:1.5em;height:1.5em;padding:0 .4em;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:.8125em;font-weight:700;background:var(--creme2);color:var(--azul)}
.cat-b[data-vazia] .n{background:#EEF1F6;color:var(--suave)}
.cat-b[aria-pressed="true"]{background:var(--azul);border-color:var(--azul);color:#fff}
.cat-b[aria-pressed="true"] .ci{color:var(--ouro-claro)}
.cat-b[aria-pressed="true"] .n{background:var(--ouro);color:var(--azul)}
.cat-urg{position:absolute;top:-.25em;right:-.25em;width:.7em;height:.7em;border-radius:50%;background:var(--ouro);border:2px solid #fff}
.det-unid{display:flex;flex-wrap:wrap;gap:.35em 1em;font-size:.875em;color:var(--suave2)}
.det-unid b{color:var(--azul)}
.bt-mudarcat{align-self:flex-start}
.obs-auto.sis svg{color:#7A5C27}
.caixa-aviso{background:var(--ouro-fundo,#F3E6CC);border-radius:.75em;padding:.65em .85em;font-size:.875em;color:#4A3B1C;display:flex;flex-direction:column;gap:.35em}
.caixa-aviso p{margin:0}
.ct-selo{display:inline-block;vertical-align:middle;font-size:.6875em;font-weight:700;letter-spacing:.04em;border-radius:999px;padding:.15em .6em;background:#EEF1F6;color:var(--suave2)}
.ct-selo.comp{background:var(--ouro-fundo,#F3E6CC);color:#5C4A24}
.ct-selo.breve{background:var(--creme2);color:#7A5C27}
.ct-sub{font-size:.8125em;color:var(--suave)}
.ct-lin{display:flex;align-items:center;gap:.4em}
.ct-lin .mp-lin{flex:1;min-width:0}
.ct-ord{display:flex;flex-direction:column;gap:.2em}
.ct-ord button{width:2.75em;height:1.7em;border-radius:.5em;border:1px solid var(--linha);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--azul)}
.ct-ord button:disabled{opacity:.35}
.ct-bts{display:flex;gap:.6em;justify-content:flex-end;flex-wrap:wrap;margin:.4em 0 .8em}
.ct-mini{min-height:2.75em;padding:0 .9em;font-size:.8125em;flex:none}
.ct-prop{display:flex;align-items:center;justify-content:space-between;gap:.75em;flex-wrap:wrap;background:var(--ouro-fundo,#F3E6CC);border-radius:1em;padding:.75em 1em;margin-bottom:.6em}
.ct-prop.sem{background:#fff;border:1.5px dashed var(--linha);margin-top:.6em}
.ct-prop b{display:block;color:var(--azul);font-size:.9375em}
.ct-prop small{display:block;font-size:.8125em;color:var(--suave)}
.ct-prop .ct-bts{margin:0}
.ct-icones .chip{width:2.9em;justify-content:center;padding:0}
.ct-filtros{display:flex;gap:.6em;flex-wrap:wrap;align-items:center;margin:.75em 0}
.ct-condo{width:auto;flex:1 1 12em}
.ct-sel{display:flex;align-items:center;justify-content:space-between;gap:.75em;flex-wrap:wrap}
.ct-sel b{font-size:.875em;color:var(--azul)}
.ct-tarefas{display:flex;flex-direction:column;gap:.35em;max-height:22em;overflow:auto;margin:.4em 0 .6em}
.ct-t{display:flex;align-items:flex-start;gap:.7em;background:#fff;border:1px solid var(--linha2);border-radius:.75em;padding:.6em .75em;cursor:pointer;min-height:2.75em}
.ct-t input{width:1.25em;height:1.25em;margin:.15em 0 0;flex:none;accent-color:var(--azul)}
.ct-t b{display:block;font-size:.9em;color:var(--azul)}
.ct-t small{display:block;font-size:.78em;color:var(--suave)}
.ct-conf{background:#fff;border:1.5px solid var(--ouro);border-radius:1em;padding:.9em 1em;display:flex;flex-direction:column;gap:.4em;margin:.4em 0 .6em}
.ct-conf b{color:var(--azul);font-family:Lora,Georgia,serif;font-size:1.05em}
.ct-conf p{margin:0;font-size:.875em;color:var(--suave2)}
.ct-hist .ct-h{display:flex;align-items:center;justify-content:space-between;gap:.75em}
.ct-hist .ct-h p{margin:0}
.ct-linha{display:flex;align-items:center;justify-content:space-between;gap:.75em}
.ct-assch{display:flex;flex-wrap:wrap;gap:.3em 1em}
.ct-assch label{display:flex;align-items:center;gap:.45em;min-height:2.5em;font-size:.875em;color:var(--suave2)}
.ct-assch input{width:1.15em;height:1.15em;accent-color:var(--azul)}
.nova-cat{display:flex;align-items:center;justify-content:space-between;gap:.75em;background:#EEF1F6;border-radius:.75em;padding:.4em .5em .4em .8em;min-height:2.75em}
.nova-cat span{display:flex;align-items:center;gap:.5em;font-weight:600;color:var(--azul)}
.pf-sec-rot{display:block;padding:.9em 1em .3em}
.pf-lista>.dica-campo{padding:.4em 1em .8em}
.nova-nota{margin:0;font-size:.8125em;color:var(--suave);background:var(--creme);border-radius:.75em;padding:.55em .8em}

.area{display:flex;gap:1.5em;align-items:flex-start}
.lista{flex:1 1 24em;min-width:0;display:flex;flex-direction:column;gap:1.5em}
.secao{display:flex;flex-direction:column;gap:.6em}
.secao h2{margin:0;font-size:.8125em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--suave)}
.secao.urg h2{color:#7A5C27}
.secao.voce h2{color:var(--azul)}
.cartao{display:flex;align-items:center;gap:.875em;padding:.75em .875em .75em 1em;border-radius:1em;background:#fff;border:2px solid transparent;box-shadow:var(--sombra)}
.secao.urg .cartao{border-color:var(--ouro);box-shadow:none}
.secao.voce .cartao{border-color:var(--ouro-claro);box-shadow:none}
.cartao.sel{border-color:var(--azul)!important}
.secao.voce .cartao.sel{background:var(--ouro-fundo)}
.posicao{flex:none;width:1.9em;height:1.9em;border-radius:50%;background:var(--ouro);color:var(--azul);font-weight:700;font-size:.9375em;display:flex;align-items:center;justify-content:center}
.cartao-abrir{flex:1;min-width:0;min-height:2.75em;text-align:left;background:none;border:none;padding:0;display:flex;flex-direction:column;gap:.3em;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.compart{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.3em;width:2em;height:1.6em;margin:-.3em -.4em -.3em .05em;border-radius:.5em;color:#9AA3B5;cursor:pointer}
.compart:hover,.compart:active{color:var(--azul2);background:#EEF1F6}
.edit-tit{display:inline-flex;align-items:center;justify-content:center;vertical-align:-.12em;width:1.5em;height:1.5em;margin-left:.15em;padding:0;border:none;border-radius:.4em;background:none;color:#9AA3B5;cursor:pointer}
.edit-tit svg{width:.72em;height:.72em}
.edit-tit:hover,.edit-tit:focus-visible{color:var(--azul2);background:#EEF1F6}
.det-topo{display:flex;align-items:center;justify-content:space-between;gap:.5em}
.bt-compart{display:inline-flex;align-items:center;gap:.4em;margin-left:auto;min-height:2.75em;padding:0 .8em;border-radius:999px;border:1px solid var(--linha);background:#fff;color:var(--azul);font-weight:600;font-size:.9375em}
.bt-compart:hover{border-color:var(--ouro)}
.opc-lista{display:flex;flex-direction:column;gap:.25em}
.cartao-titulo{font-size:1.0625em;font-weight:500;line-height:1.3;color:var(--texto);overflow-wrap:anywhere}
.secao.urg .cartao-titulo,.secao.voce .cartao-titulo{font-weight:600;color:var(--azul)}
.cartao-meta{font-size:.8125em;color:var(--suave)}
.etiqueta{align-self:flex-start;font-size:.75em;font-weight:600;color:var(--vinho);background:var(--vinho-fundo);border-radius:999px;padding:.3em .7em}
.concluir{flex:none;width:2.75em;height:2.75em;border-radius:50%;border:2px solid #B8C0D0;background:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.concluir svg{stroke:#8A93A8}
.secao.urg .concluir{border:2.5px solid var(--azul)}
.secao.urg .concluir svg{stroke:var(--azul)}
.secao.voce .concluir{border:none;background:var(--ouro)}
.secao.voce .concluir svg{stroke:var(--azul)}
.vazio{margin:0;padding:1.25em;text-align:center;color:var(--suave);font-size:.9375em;background:#fff;border-radius:1em}
.carregando{padding:2.5em 1em;text-align:center;color:var(--suave)}



/* ---------- v1.10: fila sem sinal, compartilhamento e registro automático ---------- */
.anx-tile.aguardando .anx-prog{background:rgba(15,38,70,.42)}
.anx-tile.aguardando .anx-prog svg{stroke:#E3C894}
.anx-fila{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;background:#FBF3E2;border:1px solid #EAD7AE;border-radius:.75em;padding:.6em .8em;font-size:.8125em;color:#5A4520}
.anx-fila svg{flex:none;stroke:#7A5C27}
.anx-fila span{flex:1;min-width:12em}
.obs-auto{display:flex;align-items:center;gap:.5em;width:100%;padding:.35em .25em;border:none;background:none;text-align:left;font:inherit;font-size:.8125em;color:var(--suave);border-radius:.5em}
button.obs-auto{cursor:pointer}
button.obs-auto:hover{background:var(--creme)}
.obs-auto svg{flex:none;color:var(--suave)}
.obs-auto span{flex:1;min-width:0}
.obs-auto b{color:var(--suave2);font-weight:600}
.obs-auto time{flex:none;font-size:.92em;color:#8A93A8}
.nova-anexos{display:flex;align-items:center;gap:.5em;margin:0;background:var(--creme);border-radius:.6em;padding:.55em .75em;font-size:.875em;font-weight:600;color:var(--azul)}

/* ================= v1.30 (Etapa D.1): tokens e componentes da casca ================= */

/* ================= Comunicação com o motor ================= */
function chamar(corpo) {
  return fetch(MOTOR, { method: 'POST', body: JSON.stringify(corpo), redirect: 'follow' })
    .then(function (r) { return r.json(); })
    .catch(function () { return { ok: false, codigo: 'REDE', mensagem: 'Sem conexão. Confira a internet e tente de novo.' }; });
}
function api(acao, dados) {
  if (!API_LEITURA[acao] && !API_PROPRIA[acao]) return gravar(acao, dados); // v1.30: toda escrita passa por gravar()
  return chamar({ fn: 'api', sessao: S.sessao, acao: acao, dados: dados || {} }).then(function (r) {
    if (!r.ok && (r.codigo === 'SESSAO' || r.codigo === 'NAO_AUTORIZADO' && acao === 'tarefas.inicio')) {
      sair(r.mensagem);
      throw r;
    }
    return r;
  });
}

/* ================= Entrada (login Google) ================= */
function mostrarEntrada(msg) {
  $('app').hidden = true; $('entrada').hidden = false;
  document.body.classList.remove('com-sel');
  $('entradaTexto').textContent = 'Entre com a sua conta Google cadastrada.';
  $('entradaTexto').hidden = false; $('botaoGoogle').hidden = false;
  $('entradaExtra').hidden = true; $('entradaExtra').innerHTML = '';
  S.tokenPendente = null;
  var m = $('entradaMsg');
  if (msg) { m.textContent = msg; m.hidden = false; } else m.hidden = true;
  iniciarGoogle();
}

var googlePronto = false;
function iniciarGoogle() {
  if (!S.cfg || $('entrada').hidden) return;
  if (!window.google || !google.accounts || !google.accounts.id) { setTimeout(iniciarGoogle, 150); return; }
  if (!googlePronto) { googlePronto = true; google.accounts.id.initialize({
    client_id: S.cfg.clientId, callback: aoEntrarGoogle, auto_select: true,
    cancel_on_tap_outside: true, use_fedcm_for_prompt: true, ux_mode: 'popup'
  }); }
  google.accounts.id.renderButton($('botaoGoogle'), {
    theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', locale: 'pt-BR', width: 280
  });
  google.accounts.id.prompt();
}

function lerToken(token) {
  try {
    var b = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    var json = decodeURIComponent(atob(b).split('').map(function (c) { return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join(''));
    var d = JSON.parse(json);
    return { foto: d.picture || '', nome: d.name || '' };
  } catch (e) { return {}; }
}

function aoEntrarGoogle(resp) {
  $('entradaTexto').textContent = 'Entrando…';
  $('entradaMsg').hidden = true;
  var info = lerToken(resp.credential);
  chamar({ fn: 'entrar', token: resp.credential, convite: ler('convite') || '' }).then(function (r) {
    if (!r.ok) { tratarSemAcesso(r, resp.credential, info); return; }
    concluirEntrada(r, info);
  });
}
function concluirEntrada(r, info) {
  S.sessao = r.sessao; S.google = info; S.tokenPendente = null;
  guardar('sessao', r.sessao); guardar('google', JSON.stringify(info)); guardar('convite', null);
  S.portal = r; S.dados = r.tarefas || null;
  abrirApp();
}

/* ---------- Sem acesso: pedir acesso pelo convite ou aguardar aprovação ---------- */
function lerConviteUrl() {
  try {
    var p = new URLSearchParams(location.search);
    var c = p.get('c');
    if (!c) return;
    guardar('convite', String(c).replace(/[^A-Za-z0-9]/g, '').slice(0, 12));
    p.delete('c');
    var q = p.toString();
    history.replaceState(null, '', location.pathname + (q ? '?' + q : ''));
  } catch (e) {}
}
function entradaExtra(html) {
  $('entradaTexto').hidden = true; $('botaoGoogle').hidden = true; $('entradaMsg').hidden = true;
  var x = $('entradaExtra'); x.innerHTML = html; x.hidden = false;
  return x;
}
function tratarSemAcesso(r, token, info) {
  if (r.codigo === 'PEDIR') { mostrarPedir(r, token, info); return; }
  if (r.codigo === 'AGUARDANDO') { mostrarAguardando(r, token, info); return; }
  if (r.codigo === 'CONVITE_VENCIDO' || r.codigo === 'CONVITE_INVALIDO') guardar('convite', null);
  mostrarEntrada(r.mensagem || 'Acesso não autorizado.');
}
function avatarDe(info, nome) {
  return '<span class="avatar">' + (info && info.foto ? '<img src="' + esc(info.foto) + '" alt="" referrerpolicy="no-referrer">' : esc(iniciais(nome || ''))) + '</span>';
}
function mostrarPedir(r, token, info) {
  S.tokenPendente = token;
  var x = entradaExtra(
    '<span class="ent-tag">Convite · ' + esc(r.convite && r.convite.empresa) + '</span>' +
    '<h2 class="ent-tit">Solicitar acesso</h2>' +
    '<div class="conta-box">' + avatarDe(info, r.nome) + '<span class="tx"><small>Entrou como</small><b>' + esc(r.email) + '</b></span>' +
      '<button type="button" class="bt-link" data-acao="trocarConta">Trocar</button></div>' +
    '<form class="ent-form" id="formPedir" novalidate>' +
      '<label class="rot-campo" for="pedNome">Seu nome</label>' +
      '<input class="campo" id="pedNome" maxlength="80" autocomplete="name" value="' + esc(r.nome || '') + '">' +
      '<p style="margin:0;font-size:.8125rem;color:var(--suave)">O responsável confere o seu pedido e libera o acesso. Você recebe um aviso por e-mail.</p>' +
      '<div class="entrada-msg" id="pedMsg" role="alert" hidden></div>' +
      '<button class="bt grande" type="submit" id="btPedir">Solicitar acesso</button>' +
    '</form>');
  x.querySelector('#formPedir').addEventListener('submit', function (e) {
    e.preventDefault();
    var nome = x.querySelector('#pedNome').value.trim();
    var msg = x.querySelector('#pedMsg');
    if (nome.length < 3) { msg.textContent = 'Escreva o seu nome.'; msg.hidden = false; return; }
    msg.hidden = true;
    umaVez('pedir', x.querySelector('#btPedir'), 'Enviando…', function () {
      return chamar({ fn: 'pedir', token: token, convite: ler('convite') || '', nome: nome });
    }).then(function (r2) {
      if (r2.codigo === 'AGUARDANDO') { guardar('convite', null); mostrarAguardando(r2, token, info); return; }
      if (r2.codigo === 'NAO_AUTORIZADO' || r2.codigo === 'SESSAO') { mostrarEntrada('Entre de novo para enviar o pedido.'); return; }
      if (r2.codigo === 'PEDIR' || r2.codigo === 'VALIDACAO' || r2.codigo === 'REDE' || r2.codigo === 'OCUPADO' || r2.codigo === 'ERRO') {
        msg.textContent = r2.mensagem || 'Algo deu errado. Tente de novo.'; msg.hidden = false; return;
      }
      tratarSemAcesso(r2, token, info);
    });
  });
}
function mostrarAguardando(r, token, info) {
  S.tokenPendente = token; S.googlePendente = info;
  var p = r.pedido || {};
  var em = p.em ? new Date(p.em) : null;
  entradaExtra(
    '<span class="ent-icone">' + IC.relogio + '</span>' +
    '<h2 class="ent-tit">Pedido enviado</h2>' +
    '<p>Seu acesso está aguardando aprovação. Assim que for liberado, você recebe um e-mail e já pode entrar por este mesmo link.</p>' +
    '<div class="ent-dados"><span><b>Empresa:</b> ' + esc(p.empresa) + '</span><span><b>Conta:</b> ' + esc(p.email) + '</span>' +
      (em ? '<span><b>Enviado em:</b> ' + dataCurta(em) + '/' + new Intl.DateTimeFormat('pt-BR', { timeZone: TZ, year: 'numeric' }).format(em) + ', ' + horaSP(em) + '</span>' : '') + '</div>' +
    '<button type="button" class="bt claro grande" data-acao="verificarPedido">Verificar de novo</button>' +
    '<button type="button" class="bt-link" data-acao="trocarConta">Sair desta conta</button>');
}
function verificarPedido(bt) {
  if (!S.tokenPendente) { mostrarEntrada(); return; }
  var info = S.googlePendente;
  umaVez('verificarPedido', bt, 'Verificando…', function () {
    return chamar({ fn: 'entrar', token: S.tokenPendente, convite: '' });
  }).then(function (r) {
    if (r.ok) { concluirEntrada(r, info); return; }
    if (r.codigo === 'AGUARDANDO') { avisar('Ainda aguardando aprovação.'); return; }
    if (r.codigo === 'NAO_AUTORIZADO') { mostrarEntrada('Entre de novo para conferir o seu pedido.'); return; }
    tratarSemAcesso(r, S.tokenPendente, info);
  });
}
function trocarConta() {
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  mostrarEntrada('');
}

function sair(msg) {
  if (S.sessao) chamar({ fn: 'api', sessao: S.sessao, acao: 'portal.sair', dados: {} });
  S.sessao = null; S.dados = null; S.det = null; S.selId = null; S.roteado = false;
  mostrarModulo('tarefas');
  guardar('sessao', null); guardar('google', null);
  try { google.accounts.id.disableAutoSelect(); } catch (e) {}
  fecharCamadas();
  mostrarEntrada(msg || '');
}

/* ================= Casca ================= */
function aplicarTela() {
  var f = faixa();
  var tela = lerLocal('tela') || telaPadrao();
  var t = TELAS.filter(function (x) { return x.id === tela; })[0] || TELAS[0];
  document.documentElement.style.fontSize = f === 'computador' ? t.px + 'px' : f === 'tablet' ? '17px' : '';
  $('telas').innerHTML = TELAS.map(function (x) {
    return '<button data-tela="' + x.id + '" aria-pressed="' + (x.id === t.id) + '">' + x.rotulo + '</button>';
  }).join('');
}
function telaPadrao() {
  var p = String((S.portal && S.portal.app && S.portal.app.telaPadrao) || (S.cfg && S.cfg.telaPadrao) || 'Automático').toLowerCase();
  if (p.indexOf('1080') >= 0) return '1080';
  if (p.indexOf('1440') >= 0) return '1440';
  if (p.indexOf('4k') >= 0) return '4k';
  return 'auto';
}

function abrirApp() {
  $('entrada').hidden = true; $('app').hidden = false;

function appRota() { var a = lerLocal('rotaApp'); return a === 'waze' || a === 'maps' ? a : ''; }

  var pref = appRota(), alvo = pref === 'waze' ? r.wazeUrl : r.mapsUrl;
  var port = r.portaria || {};
  var h = '<div class="jan-corpo cc">' +
    '<div class="cc-end"><div class="cc-end-tx"><b>' + esc(r.nome) + '</b><span>' + esc(r.endereco) + '</span></div>' +

      (port.whatsUrl ? '<a class="bt claro" href="' + esc(port.whatsUrl) + '" target="_blank" rel="noopener">' + IC.zap + 'WhatsApp</a>' : '') + '</div></div>' : '') +
    '<div class="cc-apps"><a class="bt ' + (pref === 'waze' ? 'claro' : 'ouro') + '" data-ccapp="maps" href="' + esc(r.mapsUrl) + '" target="_blank" rel="noopener">Google Maps</a>' +
      '<a class="bt ' + (pref === 'waze' ? 'ouro' : 'claro') + '" data-ccapp="waze" href="' + esc(r.wazeUrl) + '" target="_blank" rel="noopener">Waze</a></div>' +
    '<label class="cc-lembrar"><input type="checkbox" id="ccLembrar"' + (pref ? ' checked' : '') + '> Lembrar minha escolha neste aparelho</label>' +
    '<button class="bt claro" data-cccopiar>Copiar endereço</button></div>';
  abrirJanela('Como chegar', r.nome, h, 'centro cc-jan', function (raiz) {
    var mostrar = function (abrir) {
      var box = $('ccMapa'), bt = $('ccMapaBt'); if (!box || !bt) return;
      if (abrir && !box.firstChild) {
        box.innerHTML = '<iframe title="Mapa de ' + esc(r.nome) + '" src="' + esc(r.mapa.embedUrl) + '" loading="lazy" referrerpolicy="no-referrer"></iframe>' +
          '<a class="cc-mapa-link" href="' + esc(alvo) + '" target="_blank" rel="noopener" aria-label="Abrir a rota no app"></a><span class="cc-atrib">' + esc(r.mapa.atribuicao || '© OpenStreetMap') + '</span>';

    };

      if (b.hasAttribute('data-cccopiar')) copiarTexto(r.endereco, 'Endereço copiado');
    });
  });
}

/* ---- Rota nas Tarefas ---- */
function botaoRota(t) {
  if (!t.rotaDestaque || !rotaDoCondo(t.condo)) return '';
  return '<button class="rota-bt" data-rota="' + esc(t.condo) + '" aria-label="Como chegar: ' + esc(t.titulo) + '" title="Como chegar">' + ICO_ROTA + '</button>';
}
function htmlRotaDet(t) {
  var r = t.rota || rotaDoCondo(t.condo);
  if (!r || !r.mapsUrl) return '';
  return '<div class="det-rota' + (t.rotaDestaque ? ' destaque' : '') + '"><div class="det-rota-tx"><b>Como chegar</b><span>' + esc(r.endereco) + '</span>' +
    (t.rotaDestaque && r.obsAcesso ? '<small>' + esc(r.obsAcesso) + '</small>' : '') + '</div>' +
    '<button class="bt ' + (t.rotaDestaque ? 'ouro' : 'claro') + '" data-rota="' + esc(t.condo) + '">' + ICO_ROTA + 'Rota</button></div>';
}
/* Ao compartilhar uma tarefa de manutenção (inclui ocorrência e inspeção), vão junto a rota e a observação de acesso. */
function rotaCompart(t) {
  if (!t || !t.rotaDestaque) return '';
  var r = (S.det && S.det.id === t.id && S.det.rota) || rotaDoCondo(t.condo);
  if (!r || !r.mapsUrl) return '';

    (r.portaria && r.portaria.telefone ? '\nPortaria: ' + r.portaria.telefone : '') + '\nComo chegar: ' + r.mapsUrl;

function cdPerfilDe(cod) { return CD_PERFIL && (CD_PERFIL.condominios || []).filter(function (x) { return x.codigo === cod; })[0]; }

function cdPerfilCarregar(cod) {

function cdIrPerfil(pv) {

  try {
    var q = new URLSearchParams(location.search); q.delete('cond'); q.set('m', 'perfil'); q.set('pv', pv);
    history.pushState({ m: 'perfil', pv: pv }, '', location.pathname + '?' + q.toString());
  } catch (e) {}

}

/* ================= Módulos e endereços (v1.30, Etapa D.1) =================
   Casca única: todo módulo abre na área principal, com a lateral e o cabeçalho de sempre, e tem endereço
   próprio (?m=<módulo>) — o voltar do navegador e o link direto funcionam. Módulo novo = uma entrada aqui. */
var MODULOS = {
  tarefas: { pode: function () { return true; } },
  ressarcimentos: { pode: function () { return !!(S.portal && S.portal.usuario && S.portal.usuario.master) && temRess(); }, abrir: function (arg) { rsMontar(arg); } },
  evolucao: { pode: function () { return !!(S.portal && S.portal.usuario && S.portal.usuario.master); }, abrir: function () { evoMontar(); } },
  perfil: { pode: function () { return temPerfil(); }, abrir: function () { pcMontar(); } }, // v1.36 (P2): Perfil dos condomínios
  condominios: { pode: function () { return temCondominios(); }, abrir: function (arg) { cdMontar(arg); } } // v1.36 (C2)
};
var modAtual = 'tarefas';
function modDaUrl() {
  try { var m = new URLSearchParams(location.search).get('m'); return m && MODULOS.hasOwnProperty(m) ? m : 'tarefas'; } catch (e) { return 'tarefas'; }
}
function urlDoMod(id) {
  var q = new URLSearchParams(location.search);
  if (id !== 'perfil') q.delete('pv'); // v1.36: a tela interna do Perfil não segue para outro módulo
  if (id === 'tarefas') q.delete('m'); else q.set('m', id);
  if (id !== 'condominios') q.delete('cond'); // v1.36
  var t = q.toString();
  return location.pathname + (t ? '?' + t : '');
}
/* Vai para um módulo. op: { arg, substituir (não cria passo no histórico), semHistorico (veio do voltar/avançar) }. */
function ir(id, op) {
  op = op || {};
  if (!MODULOS.hasOwnProperty(id) || !MODULOS[id].pode()) id = 'tarefas';
  if (!op.semHistorico) {
    try {
      var temM = new URLSearchParams(location.search).has('m');
      if (modDaUrl() !== id || (id === 'tarefas' && temM)) history[op.substituir ? 'replaceState' : 'pushState']({ m: id }, '', urlDoMod(id));
    } catch (e) {}
  }
  if (id === modAtual && op.arg === undefined) return;
  mostrarModulo(id, op.arg);
}
function mostrarModulo(id, arg) {
  var host = $('modHost'), pr = $('principal'), tar = id === 'tarefas';
  if (id !== modAtual) fecharCamadas();
  if (!tar && S.selId) fecharDetalhe();
  host.innerHTML = '';
  modAtual = id;
  pr.hidden = !tar; host.hidden = tar;
  document.body.classList.toggle('mod-outro', !tar);
  marcarModulo(); medirCasca();
  if (!tar) MODULOS[id].abrir(arg);
  window.scrollTo(0, 0);
}
/* Tela de um módulo integrado: mesmo cabeçalho das Tarefas (título + linha de apoio). */
function moduloTela(titulo, sub, corpoHtml, montar) {
  var host = $('modHost');
  host.innerHTML = '<section class="janela gestao integrada" aria-label="' + esc(titulo) + '">' +
    '<div class="jan-cab mod-cab"><div><h1>' + esc(titulo) + '</h1><small>' + esc(sub) + '</small></div></div>' + corpoHtml + '</section>';
  if (montar) montar(host.querySelector('.janela'));
}
/* Marca o módulo aberto (dourado) na lateral, na coluna de ícones e na barra de baixo. */
function marcarModulo() {
  Array.prototype.forEach.call(document.querySelectorAll('.lateral .lat-item, .coluna-icones .ic, .barra-baixo .bb'), function (el) {
    var m = el.getAttribute('data-mod') || el.getAttribute('data-acao');
    if (!MODULOS.hasOwnProperty(m)) return;
    if (m === modAtual) el.setAttribute('aria-current', 'page'); else el.removeAttribute('aria-current');
  });
  Array.prototype.forEach.call(document.querySelectorAll('.lateral .lat-item'), function (el) { // nome do item para a faixa de ícones
    var sp = el.querySelector('span:not(.cont)');
    if (sp && !el.getAttribute('aria-label')) el.setAttribute('aria-label', sp.textContent.trim());
  });
}
/* Altura do topo e da barra de baixo, para a lateral e os módulos ocuparem a tela certinho. */
function medirCasca() {
  var t = document.querySelector('.topo'), b = document.querySelector('.barra-baixo');
  if (!t || $('app').hidden) return;
  var st = document.documentElement.style;
  st.setProperty('--topo-h', t.offsetHeight + 'px');
  st.setProperty('--baixo-h', (b && b.offsetHeight ? b.offsetHeight : 0) + 'px');
}
window.addEventListener('popstate', function () { if (S.sessao && !$('app').hidden) ir(modDaUrl(), { semHistorico: true }); });

/* ---- Lateral recolhível (computador): faixa de ícones, lembrada neste navegador; atalho "[" ---- */
function lateralRecolhida() { return document.documentElement.getAttribute('data-lateral') === 'recolhida'; }
function desenharBotaoLateral() {
  var b = $('btLateral'); if (!b) return;
  var rec = lateralRecolhida(), rot = rec ? 'Expandir menu' : 'Recolher menu';
  b.setAttribute('aria-pressed', rec ? 'true' : 'false');
  b.setAttribute('aria-label', rot + ' (tecla [)');
  $('btLateralTxt').textContent = rot;
}
function alternarLateral() {
  var rec = !lateralRecolhida();
  if (rec) document.documentElement.setAttribute('data-lateral', 'recolhida'); else document.documentElement.removeAttribute('data-lateral');
  guardarLocal('lateral', rec ? 'recolhida' : 'expandida');
  desenharBotaoLateral(); esconderDica();
}
document.addEventListener('keydown', function (e) {
  if (e.key !== '[' || e.ctrlKey || e.metaKey || e.altKey || faixa() !== 'computador' || $('app').hidden) return;
  var t = e.target;
  if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
  e.preventDefault(); alternarLateral();
});
/* Com a lateral recolhida, o nome do item aparece ao passar o mouse ou focar pelo teclado. */
function mostrarDica(el) {
  var d = $('latDica'); if (!d) return;
  if (!lateralRecolhida() || faixa() !== 'computador') { d.hidden = true; return; }
  var r = el.getBoundingClientRect();
  d.textContent = el.getAttribute('aria-label') || '';
  d.style.left = (r.right + 10) + 'px'; d.style.top = (r.top + r.height / 2) + 'px';
  d.hidden = !d.textContent;
}
function esconderDica() { var d = $('latDica'); if (d) d.hidden = true; }
['mouseover', 'focusin'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    var el = e.target.closest && e.target.closest('.lateral .lat-item, .lateral .lat-recolher');
    if (el) mostrarDica(el); else esconderDica();
  });
});
document.addEventListener('focusout', esconderDica);

/* ================= Dados ================= */
var recarregando = false;
function recarregar() {
  if (recarregando || !S.sessao) return Promise.resolve();
  recarregando = true;
  return Promise.all([api('portal.inicio'), api('tarefas.inicio', S.cat ? { categoria: S.cat } : {})]).then(function (rs) {

function enviarAnexo(idTarefa, file, etapa, extra) {

  var envios = S.envios[idTarefa] || (S.envios[idTarefa] = []);

    item.tipo = foto ? 'image/jpeg' : (file.type || (video ? (/\.mov$/i.test(item.nome) ? 'video/quicktime' : 'video/mp4') : 'application/octet-stream'));

    return blobParaB64(pedaco).then(function (b64) { return api('tarefas.anexoParte', { upload: upload, inicio: inicio, dados: b64 }); })
      .then(function (r) {
        if (!r.ok) {

  })).then(function () {

var IDB = null;
function idb() {

      if (!db.objectStoreNames.contains('fila')) db.createObjectStore('fila', { keyPath: 'idCliente' });
      if (!db.objectStoreNames.contains('compartilhado')) db.createObjectStore('compartilhado', { keyPath: 'id' });
    };
    r.onsuccess = function () { ok(r.result); };

}
function idbOp(loja, modo, fn) {

}

/* Envia um item da fila. Sem sinal: fica guardado no aparelho e vai sozinho depois. */
function enviarItem(item, tmp) {

    idObs: item.idObs || '', origem: item.origem || 'app', idCliente: item.idCliente };

    }

  tirarEnvio(item.idTarefa, tmp);

/* Tenta de novo tudo o que ficou na fila (ao abrir o app, ao voltar o sinal, ao voltar para o app). */
function processarFila() {
  if (S.filaRodando || !S.sessao || !S.dados || navigator.onLine === false) return;
  S.filaRodando = true;
  filaTodos().then(function (itens) {
    itens.sort(function (a, b) { return a.criadoEm - b.criadoEm; });
    var i = 0;
    var proximo = function () {
      if (i >= itens.length) { S.filaRodando = false; return; }
      var item = itens[i++];
      var lista = S.envios[item.idTarefa] || (S.envios[item.idTarefa] = []);
      var tmp = lista.filter(function (x) { return x.tmp === item.idCliente; })[0];
      if (tmp && tmp.estado === 'enviando') { proximo(); return; }
      if (!tmp) {
        tmp = { tmp: item.idCliente, etapa: item.etapa, nome: item.nome, progresso: 0, url: item.mini ? URL.createObjectURL(item.mini) : null, estado: 'aguardando', video: !!item.video, duracao: item.duracao || 0, item: item.item || 0 };
        lista.push(tmp);
      }
      enviarItem(item, tmp).then(function (r) {
        if (!r.ok && r.codigo === 'REDE') { S.filaRodando = false; return; }
        proximo();
      });
    };
    proximo();
  });
}
/* Ao abrir o app: mostra o que está guardado esperando sinal. */
function carregarFila() {
  filaTodos().then(function (itens) {
    if (!itens.length) return;
    itens.forEach(function (item) {
      var lista = S.envios[item.idTarefa] || (S.envios[item.idTarefa] = []);
      if (lista.some(function (x) { return x.tmp === item.idCliente; })) return;
      lista.push({ tmp: item.idCliente, etapa: item.etapa, nome: item.nome, progresso: 0, url: item.mini ? URL.createObjectURL(item.mini) : null, estado: 'aguardando', video: !!item.video, duracao: item.duracao || 0, item: item.item || 0 });
    });
    avisar(itens.length + (itens.length === 1 ? ' anexo aguardando envio' : ' anexos aguardando envio'));
    desenharAnexos();
    processarFila();
  });
}
window.addEventListener('online', function () { S.avisouFila = false; processarFila(); });

    if (r.jaConcluida) { avisar('Essa tarefa já tinha sido concluída' + (r.por ? ' por ' + r.por : '') + '.'); recarregar(); return; }
    if (!r.ok) { avisar(r.mensagem, true); recarregar(); return; }
    var seg = r.desfazerSeg || (S.dados.regras && S.dados.regras.desfazerSeg) || 5;

    else folhaConclusao(snap, seg, textoZap);

function desfazer(id) {

function abrirTarefa(id, silencioso) {
  if (!silencioso && modAtual !== 'tarefas') ir('tarefas'); // v1.30: a tarefa abre no módulo Tarefas
  guardarLocal('ultimaTarefa', id);
  S.selId = id; S.editandoDesc = false; S.editandoTitulo = false;
  if (S.editandoPreco !== id) S.editandoPreco = null;

  document.body.classList.add('com-sel');
  marcarSelecionado();

    S.det = null;
    $('detalhe').innerHTML = cabDetalheVoltar() + '<div class="carregando">Abrindo…</div>';
  }
  api('tarefas.abrir', { id: id }).then(function (r) {
    if (S.selId !== id) return;
    if (!r.ok) { avisar(r.mensagem, true); fecharDetalhe(); recarregar(); return; }
    S.det = r.tarefa;
    desenharDetalhe();
    if (r.tarefa.inspecao && insFilaN(id)) insEnviarFila(id); // v1.27: respostas guardadas sem sinal
    lerAlertasDa(id);

}

function etapasCompra(c) {
  var passos = ['Solicitada'];
  if (c.passouPorAprovacao) passos.push('Aprovação');
  if (c.etapa === 'Recusada') passos.push('Recusada'); else passos.push('Comprada', 'Recebida');
  var atual = { 'Solicitada': 'Solicitada', 'Aguardando aprovação': 'Aprovação', 'Aprovada': 'Comprada', 'Comprada': 'Recebida', 'Recebida': '', 'Recusada': 'Recusada' }[c.etapa];
  var iAtual = atual ? passos.indexOf(atual) : passos.length;
  if (c.etapa === 'Solicitada' && c.liberada) iAtual = passos.indexOf('Comprada');
  return '<div class="etapas" role="list" aria-label="Etapas da compra">' + passos.map(function (p, k) {
    var parou = p === 'Recusada';
    var cls = parou ? 'parou' : k < iAtual ? 'feito' : k === iAtual ? 'atual' : '';
    var rot = p === 'Aprovação' ? (c.etapa === 'Aguardando aprovação' ? 'Aguardando aprovação' : 'Aprovada') : p;
    return (k ? '<span class="li' + (k <= iAtual && !parou ? ' feito' : '') + '" aria-hidden="true"></span>' : '') +
      '<span class="et ' + cls + '" role="listitem"' + (k === iAtual && !parou ? ' aria-current="step"' : '') + '><span class="bo">' +
      (parou ? IC.xP : k < iAtual ? IC.okP : (k + 1)) + '</span>' + esc(rot) + '</span>';
  }).join('') + '</div>';
}

  S.sinoLista = lista.filter(function (i) { return chaves.indexOf(i.k) < 0; });

/* ---------- Ficha da empresa ---------- */
function formDeEmpresa(e) {
  return { tipo: 'empresa', novo: !e, apelido: e ? e.apelido : '', ativa: e ? e.ativa : true, condos: (e ? e.condos : []).slice(),
    razao: '', tipoForn: '', email: '', mudou: false };
}
function htmlFichaEmpresa(f) {
  var d = G.dados, e = f.novo ? null : gesEmpresa(f.apelido);
  var h = '<button class="bt-link ges-voltar" data-ges-voltar>‹ Empresas</button>';
  if (e) {
    h += '<div class="ges-cab"><span class="avatar ges-av-emp" aria-hidden="true">' + esc(gesNomeEmp(e.apelido).slice(0, 2).toUpperCase()) + '</span><span class="tx"><b>' + esc(gesNomeEmp(e.apelido)) + '</b><small>' +
      esc([e.razao, e.tipo].filter(String).join(' · ') || (e.casa ? 'A sua empresa' : 'Sem dados na FORNECEDORES')) + '</small></span>' +
      '<span class="ges-tag ' + (e.ativa ? 'verde' : 'cinza') + '">' + (e.ativa ? 'Ativa' : 'Inativa') + '</span></div>';
    if (e.incompleta) h += '<div class="alerta-ouro"><b>Cadastro incompleto na FORNECEDORES.</b> Peça ao Claude: “completar o cadastro do fornecedor ' + esc(e.apelido) + '”.</div>';
    var ativos = d.usuarios.filter(function (u) { return u.empresa === e.apelido && u.status === 'Ativo'; }).length;
    var inat = d.usuarios.filter(function (u) { return u.empresa === e.apelido && u.status !== 'Ativo'; }).length;
    h += '<div class="ges-nums"><div><b>' + ativos + '</b><span>' + (ativos === 1 ? 'pessoa ativa' : 'pessoas ativas') + '</span></div><div><b>' + inat + '</b><span>' + (inat === 1 ? 'inativa' : 'inativas') + '</span></div><div><b>' + f.condos.length + '</b><span>' + (f.condos.length === 1 ? 'condomínio' : 'condomínios') + '</span></div></div>';
  } else {
    h += '<h2 class="ges-tit">Cadastrar empresa</h2>' +
      '<label class="ges-campo"><span class="rotulo">Apelido</span><input type="text" id="gesApelido" maxlength="40" placeholder="Ex.: SJC" value="' + esc(f.apelido) + '" autocomplete="off"></label>' +
      '<p class="dica-campo">É o nome curto que aparece no app e nas tarefas. Não muda depois.</p>' +
      '<label class="ges-campo"><span class="rotulo">Razão social (opcional)</span><input type="text" id="gesRazao" maxlength="120" value="' + esc(f.razao) + '"></label>' +
      '<label class="ges-campo"><span class="rotulo">Tipo de serviço (opcional)</span><input type="text" id="gesTipo" maxlength="60" placeholder="Ex.: Manutenção" value="' + esc(f.tipoForn) + '"></label>' +
      '<label class="ges-campo"><span class="rotulo">E-mail (opcional)</span><input type="email" id="gesEmailEmp" maxlength="120" value="' + esc(f.email) + '"></label>' +
      '<p class="dica-campo">Se a empresa não estiver na FORNECEDORES, o app cria uma linha básica lá, marcada como incompleta.</p>';
  }
  var casa = e ? e.casa : ehCasa(f.apelido);
  h += '<span class="rotulo">Condomínios que ' + (casa ? 'a casa atende' : 'a empresa atende') + '</span><div class="ges-cds">' + d.condos.map(function (c) {
    var on = f.condos.indexOf(c.codigo) >= 0;
    return '<button class="ges-cd" data-gf-cd="' + esc(c.codigo) + '" aria-pressed="' + on + '"><span class="cx" aria-hidden="true"></span>' + esc(c.nome) + '</button>';
  }).join('') + '</div>';
  var tirados = e ? e.condos.filter(function (c) { return f.condos.indexOf(c) < 0; }) : [];
  var afetados = e && tirados.length ? d.usuarios.filter(function (u) { return u.empresa === e.apelido && tirados.some(function (c) { return u.papeis[c]; }); }).length : 0;
  if (afetados) h += '<div class="alerta-ouro">Desmarcar ' + esc(tirados.map(gesCondoNome).join(', ')) + ' tira o acesso de ' + afetados + (afetados === 1 ? ' pessoa' : ' pessoas') + ' da ' + esc(gesNomeEmp(e.apelido)) + ' a ' + (tirados.length === 1 ? 'esse condomínio' : 'esses condomínios') + '.</div>';
  else h += '<p class="dica-campo">Desmarcar um condomínio tira o acesso de todas as pessoas da empresa a ele.</p>';
  if (!casa) {
    h += '<span class="rotulo">Situação</span><div class="pills"><button class="pill" data-gf-ativa="1" aria-pressed="' + f.ativa + '">Ativa</button><button class="pill" data-gf-ativa="0" aria-pressed="' + (!f.ativa) + '">Inativa</button></div>';
    if (!f.ativa) h += '<p class="dica-campo">Empresa inativa: ninguém dela entra no app e ela some das listas, mas nada é apagado.</p>';
  }
  if (e) h += htmlHistorico('empresa:' + e.apelido.toLowerCase());
  h += '<div class="entrada-msg" id="gesErro" role="alert" hidden></div><div class="ges-rodape"><button class="bt-link" data-ges-voltar>Cancelar</button><span class="esp"></span>' +
    '<button class="bt" id="gesSalvar"' + (f.novo || f.mudou ? '' : ' disabled') + '>' + (f.novo ? 'Cadastrar empresa' : (afetados && G.conf === 'empresa' ? 'Confirmar e salvar' : 'Salvar alterações')) + '</button></div>';
  return h;
}

function desenharGesFicha() {
  var el = $('gesFicha'); if (!el) return;
  var f = G.form;
  if (!f) {
    el.innerHTML = '<p class="vazio ges-dica">' + (G.aba === 'pessoas' ? 'Escolha uma pessoa na lista para ver e mudar o acesso.' : 'Escolha uma empresa para ver os condomínios que ela atende.') + '</p>';
    return;
  }
  var topo = el.scrollTop;
  el.innerHTML = f.tipo === 'pessoa' ? htmlFichaPessoa(f) : htmlFichaEmpresa(f);
  el.scrollTop = topo;
  if ($('gesHist') && !f.histCarregado) { f.histCarregado = true; carregarHistorico(); }
  else if ($('gesHist') && f.histHtml) $('gesHist').innerHTML = f.histHtml;
}
function gesMarcarMudou() {
  G.form.mudou = true; G.conf = '';
  var h = $('gesHist'); if (h) G.form.histHtml = h.innerHTML;
  desenharGesFicha();
}

/* ---------- Eventos ---------- */
function cliqueGestao(ev) {
  var b = ev.target.closest('button'); if (!b || !G || !G.dados) return;
  var a;
  if ((a = b.getAttribute('data-ges-aba'))) { G.aba = a; G.sel = null; G.novo = false; G.form = null; G.conf = ''; desenharGestao(); return; }
  if (b.hasAttribute('data-ges-emp')) { G.emp = b.getAttribute('data-ges-emp'); desenharGesLista(); return; }
  if ((a = b.getAttribute('data-ges-situ'))) { G.situ = a; desenharGesLista(); return; }
  if ((a = b.getAttribute('data-ges-pessoa'))) {
    var u = G.dados.usuarios.filter(function (x) { return x.email === a; })[0];
    G.sel = a; G.novo = false; G.form = formDePessoa(u); G.conf = ''; desenharGestao(); $('gesFicha').scrollTop = 0; return;
  }
  if ((a = b.getAttribute('data-ges-empresa'))) {
    G.sel = 'empresa:' + a; G.novo = false; G.form = formDeEmpresa(gesEmpresa(a)); G.conf = ''; desenharGestao(); $('gesFicha').scrollTop = 0; return;
  }
  if ((a = b.getAttribute('data-ges-novo'))) {
    G.sel = null; G.novo = true; G.conf = ''; G.form = a === 'pessoa' ? formDePessoa(null) : formDeEmpresa(null);
    desenharGestao(); $('gesFicha').scrollTop = 0;
    var foco = $(a === 'pessoa' ? 'gesNome' : 'gesApelido'); if (foco && faixa() === 'computador') foco.focus();
    return;
  }
  if (b.hasAttribute('data-ges-voltar')) { G.sel = null; G.novo = false; G.form = null; G.conf = ''; desenharGestao(); return; }
  var f = G.form; if (!f) return;
  if ((a = b.getAttribute('data-gf-empresa'))) {
    if (a === f.empresa) return;
    f.empresa = a;
    var em = gesEmpresa(a);
    Object.keys(f.papeis).forEach(function (c) { if (!em || em.condos.indexOf(c) < 0) delete f.papeis[c]; });
    if (em && em.condos.length === 1 && f.novo && !Object.keys(f.papeis).length) f.papeis[em.condos[0]] = 'O';
    gesMarcarMudou(); return;
  }
  if ((a = b.getAttribute('data-gf-perfil'))) { f.perfil = a; gesMarcarMudou(); return; }
  if (b.hasAttribute('data-gf-ativ')) { f.atividade = b.getAttribute('data-gf-ativ'); gesMarcarMudou(); return; }
  if ((a = b.getAttribute('data-gf-papel'))) {
    var pr = a.split('|');
    if (pr[1]) f.papeis[pr[0]] = pr[1]; else delete f.papeis[pr[0]];
    gesMarcarMudou(); return;
  }
  if ((a = b.getAttribute('data-gf-cd'))) {
    var i = f.condos.indexOf(a);
    if (i >= 0) f.condos.splice(i, 1); else f.condos.push(a);
    gesMarcarMudou(); return;
  }
  if ((a = b.getAttribute('data-gf-ativa'))) { f.ativa = a === '1'; gesMarcarMudou(); return; }
  if (b.id === 'gesStatus') { statusPessoaGestao(b); return; }
  if (b.id === 'gesSalvar') { if (f.tipo === 'pessoa') salvarPessoaGestao(b); else salvarEmpresaGestao(b); }
}
function entradaGestao(ev) {
  var t = ev.target;
  if (t.id === 'gesBusca') {
    G.busca = t.value;
    var pos = t.selectionStart;
    desenharGesLista();
    var nb = $('gesBusca'); if (nb) { nb.focus(); try { nb.setSelectionRange(pos, pos); } catch (e) {} }
    return;
  }
  var f = G && G.form; if (!f) return;
  var mapa = { gesNome: 'nome', gesEmail: 'email', gesApelido: 'apelido', gesRazao: 'razao', gesTipo: 'tipoForn', gesEmailEmp: 'email' };
  if (mapa[t.id]) { f[mapa[t.id]] = t.value; f.mudou = true; }
}
function mudancaGestao(ev) {
  var m = ev.target.getAttribute && ev.target.getAttribute('data-gf-mod');
  if (m && G.form) { G.form.modulos[m] = ev.target.checked; gesMarcarMudou(); }
}
function gesErro(msg) { var e = $('gesErro'); if (e) { e.textContent = msg; e.hidden = false; } }
function salvarPessoaGestao(bt) {
  var f = G.form;
  var mods = Object.keys(f.modulos).filter(function (k) { return f.modulos[k]; });
  if (f.novo && !String(f.nome).trim()) return gesErro('Escreva o nome.');
  if (f.novo && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(f.email).trim())) return gesErro('Confira o e-mail.');
  if (!f.empresa) return gesErro('Escolha a empresa.');
  umaVez('gesPessoa:' + (f.email || 'novo'), bt, f.novo ? 'Cadastrando…' : 'Salvando…', function () {
    return api('portal.salvarUsuario', { email: f.email, novo: f.novo, nome: f.novo ? f.nome : '', empresa: f.empresa, perfil: f.perfil,
      atividade: f.atividade, modulos: mods, papeis: f.papeis });
  }).then(function (r) {
    if (!r.ok) return gesErro(r.mensagem);
    avisar(r.novo ? 'Acesso liberado para ' + f.nome.trim() : 'Cadastro atualizado');
    G.sel = r.email; G.novo = false; G.emp = ''; G.situ = 'Ativo';
    carregarGestao(true).then(function () {
      var u = G.dados && G.dados.usuarios.filter(function (x) { return x.email === r.email; })[0];
      G.form = u ? formDePessoa(u) : null; G.conf = '';
      desenharGestao();
    });
  });
}
function statusPessoaGestao(bt) {
  var f = G.form, u = G.dados.usuarios.filter(function (x) { return x.email === f.email; })[0];
  if (!u) return;
  if (G.conf !== 'status') { G.conf = 'status'; var h = $('gesHist'); if (h) f.histHtml = h.innerHTML; desenharGesFicha(); return; }
  var ativar = u.status !== 'Ativo';
  umaVez('gesStatus:' + u.email, bt, ativar ? 'Reativando…' : 'Inativando…', function () {
    return api('portal.statusUsuario', { email: u.email, ativo: ativar });
  }).then(function (r) {
    if (!r.ok) return gesErro(r.mensagem);
    avisar(ativar ? u.nome + ' voltou a ter acesso' : u.nome + ' não entra mais no app');
    G.situ = ativar ? 'Ativo' : 'Inativo';
    carregarGestao(true).then(function () {
      var nu = G.dados && G.dados.usuarios.filter(function (x) { return x.email === u.email; })[0];
      G.form = nu ? formDePessoa(nu) : null; G.conf = '';
      desenharGestao();
    });
  });
}
function salvarEmpresaGestao(bt) {
  var f = G.form, e = f.novo ? null : gesEmpresa(f.apelido);
  if (f.novo && !String(f.apelido).trim()) return gesErro('Escreva o apelido da empresa.');
  var tirados = e ? e.condos.filter(function (c) { return f.condos.indexOf(c) < 0; }) : [];
  var afetados = e && tirados.length ? G.dados.usuarios.filter(function (u) { return u.empresa === e.apelido && tirados.some(function (c) { return u.papeis[c]; }); }).length : 0;
  if (afetados && G.conf !== 'empresa') { G.conf = 'empresa'; var h = $('gesHist'); if (h) f.histHtml = h.innerHTML; desenharGesFicha(); gesErro('Confira o aviso acima e toque de novo para confirmar.'); return; }
  umaVez('gesEmpresa:' + (f.apelido || 'nova'), bt, 'Salvando…', function () {
    return api('portal.salvarEmpresa', { apelido: f.apelido, novo: f.novo, ativa: f.ativa, condos: f.condos, razao: f.razao, tipo: f.tipoForn, email: f.email });
  }).then(function (r) {
    if (!r.ok) return gesErro(r.mensagem);
    avisar(r.nova ? 'Empresa ' + r.apelido + ' cadastrada' + (r.criouFornecedor ? ' (linha criada na FORNECEDORES)' : '') : 'Empresa atualizada' + (r.afetados ? ' · acesso ajustado de ' + r.afetados + (r.afetados === 1 ? ' pessoa' : ' pessoas') : ''));
    G.sel = 'empresa:' + r.apelido; G.novo = false;
    carregarGestao(true).then(function () {
      var ne = gesEmpresa(r.apelido);
      G.form = ne ? formDeEmpresa(ne) : null; G.conf = '';
      desenharGestao();
    });
  });
}

/* ================= Minha equipe (gestor da parceira, v1.13) ================= */
var EQ = null;
function abrirEquipe(idConferir) {
  EQ = { dados: null, tela: 'lista', sel: null, form: null, conf: '', abrirId: typeof idConferir === 'string' ? idConferir : '' };
  abrirJanela('Minha equipe', 'Carregando…', '<div class="jan-corpo"><p class="vazio">Carregando a equipe…</p></div>', 'centro', function (raiz) {
    raiz.querySelector('.jan-corpo').addEventListener('click', cliqueEquipe);
    raiz.querySelector('.jan-corpo').addEventListener('input', function (e) {
      if (!EQ || !EQ.form) return;
      if (e.target.id === 'eqNome') EQ.form.nome = e.target.value;
      if (e.target.id === 'eqEmail') EQ.form.email = e.target.value;
    });
    carregarEquipe();
  });
}
function eqRaiz() { var c = document.querySelector('#camadas .janela'); return c && c.getAttribute('aria-label') === 'Minha equipe' ? c : null; }
function carregarEquipe() {
  return api('portal.equipe').then(function (r) {
    var raiz = eqRaiz(); if (!raiz) return;
    if (!r.ok) { corpoJanela(raiz, '', '<p class="vazio">' + esc(r.mensagem) + '</p>'); return; }
    EQ.dados = r;
    if (EQ.abrirId) {
      var pa = (r.aguardandoVoce || []).filter(function (x) { return x.id === EQ.abrirId; })[0];
      EQ.abrirId = '';
      if (pa) { EQ.tela = 'conferir'; EQ.sel = pa.id; EQ.conf = ''; EQ.form = { papeis: JSON.parse(JSON.stringify(pa.papeis || {})) }; if (!Object.keys(EQ.form.papeis).length && r.condos.length === 1) EQ.form.papeis[r.condos[0].codigo] = 'O'; }
      else avisar('Este pedido já foi tratado.');
    }
    desenharEquipe();
  });
}
function eqCondoNome(cod) {
  var c = ((EQ.dados && EQ.dados.condos) || []).filter(function (x) { return x.codigo === cod; })[0];
  return c ? c.nome : cod;
}
function eqResumo(papeis, perfil) {
  var cods = Object.keys(papeis || {});
  if (!cods.length) return perfil === 'Gestor' ? 'todos os condomínios da empresa' : 'sem condomínio';
  return cods.map(function (c) { return eqCondoNome(c) + (papeis[c] === 'L' ? ' (L)' : ''); }).join(' · ');
}
function desenharEquipe() {
  var raiz = eqRaiz(); if (!raiz || !EQ.dados) return;
  if (EQ.tela === 'ficha' || EQ.tela === 'novo') return desenharEquipeFicha();
  if (EQ.tela === 'convite') return desenharEquipeConvite();
  if (EQ.tela === 'conferir') return desenharEquipeConferir();
  var d = EQ.dados, h = '';
  var ativos = d.membros.filter(function (m) { return m.status === 'Ativo'; });
  var inativos = d.membros.filter(function (m) { return m.status !== 'Ativo'; });
  var prazo = d.prazoGestorDias || 3;
  h += '<div class="eq-acoes"><button class="bt grande" data-eq-convidar>' + IC.pessoaMaisOuro + 'Convidar funcionário</button>' +
    '<button class="bt grande claro" data-eq-novo>+ Cadastrar manualmente</button></div>';
  var voce = d.aguardandoVoce || [];
  if (voce.length) {
    h += '<p class="rotulo eq-rot-ouro">Aguardando você · ' + voce.length + '</p><div class="mp-lista">';
    voce.forEach(function (p) {
      h += '<button class="ges-item eq-voce" data-eq-conferir="' + esc(p.id) + '">' + avatarDe(null, p.nome) + '<span class="tx"><b>' + esc(p.nome) + '</b><small>Entrou pelo seu convite · ' + esc(haQuanto(p.em)) +
        '</small><small class="eq-prazo">' + esc(eqSobe(p.sobeEm)) + '</small></span>' + IC.chevD + '</button>';
    });
    h += '</div>';
  }
  if (d.pendentes.length) {
    h += '<p class="rotulo eq-rot-ouro">Aguardando aprovação do síndico · ' + d.pendentes.length + '</p><div class="mp-lista">';
    d.pendentes.forEach(function (p) {
      h += '<div class="ges-item eq-pend">' + avatarDe(null, p.nome) + '<span class="tx"><b>' + esc(p.nome) + '</b><small>' + esc(p.tipo) +
        (Object.keys(p.papeis || {}).length ? ' · ' + esc(eqResumo(p.papeis)) : '') + ' · ' + esc(haQuanto(p.em)) + '</small></span>' +
        (p.meu ? '<button class="bt-link" data-eq-cancelar="' + esc(p.id) + '">' + (EQ.conf === 'cancelar:' + p.id ? 'Confirmar' : 'Cancelar') + '</button>' : '') + '</div>';
    });
    h += '</div>';
  }
  h += '<p class="rotulo">Ativos · ' + ativos.length + '</p><div class="mp-lista">';
  ativos.forEach(function (m) { h += eqItem(m); });
  h += '</div>';
  if (inativos.length) {
    h += '<p class="rotulo">Inativos · ' + inativos.length + '</p><div class="mp-lista">';
    inativos.forEach(function (m) { h += eqItem(m); });
    h += '</div>';
  }
  var convs = d.convites || [];
  if (convs.length) {
    h += '<p class="rotulo">Convites valendo · ' + convs.length + '</p><div class="mp-lista">';
    convs.forEach(function (c) {
      h += '<div class="ges-item eq-conv"><span class="ic">' + IC.link + '</span><span class="tx"><b>Convite de ' + esc(c.criado) + '</b><small>' +
        esc(eqVence(c.venceDias) + ' · ' + (c.usos ? (c.usos === 1 ? '1 pessoa entrou' : c.usos + ' pessoas entraram') : 'ninguém entrou ainda')) + '</small></span>' +
        '<button class="bt-link" data-eq-cancconv="' + esc(c.codigo) + '">' + (EQ.conf === 'conv:' + c.codigo ? 'Confirmar' : 'Cancelar') + '</button></div>';
    });
    h += '</div>';
  }
  h += '<div class="eq-regra"><b>Como funciona</b><p>Mande o convite pelo WhatsApp. Quem entrar pelo link aparece em "Aguardando você": confira se é da sua equipe, marque os condomínios e envie. O síndico aprova. Se você não conferir em ' + prazo + ' dias, o pedido vai direto para o síndico.</p>' +
    '<p>Mudar os condomínios de alguém também passa pelo síndico. Inativar quem saiu da empresa corta o acesso na hora, e o síndico é avisado.</p></div>';
  corpoJanela(raiz, d.empresa + ' · ' + ativos.length + (ativos.length === 1 ? ' pessoa ativa' : ' pessoas ativas'), h);
}
function eqItem(m) {
  return '<button class="ges-item" data-eq-pessoa="' + esc(m.email) + '"' + (m.voce ? ' disabled' : '') + '>' + avatarDe(null, m.nome) +
    '<span class="tx"><b>' + esc(m.nome) + (m.voce ? ' <span style="font-weight:500;color:var(--suave)">(você)</span>' : '') + '</b><small>' +
    esc(m.perfil + ' · ' + eqResumo(m.papeis, m.perfil)) + '</small></span>' + (m.voce ? '' : IC.chevD) + '</button>';
}
function desenharEquipeFicha() {
  var raiz = eqRaiz(), d = EQ.dados, f = EQ.form, h = '';
  var m = EQ.tela === 'ficha' ? d.membros.filter(function (x) { return x.email === EQ.sel; })[0] : null;
  var pend = m ? d.pendentes.filter(function (p) { return p.email === m.email; })[0] : null;
  h += '<button class="bt-link ges-voltar" style="display:inline-block" data-eq-voltar>‹ Minha equipe</button>';
  if (m) {
    h += '<div class="ges-cab">' + avatarDe(null, m.nome) + '<span class="tx"><b>' + esc(m.nome) + '</b><small>' + esc(m.email) + '</small></span>' +
      '<span class="ges-tag ' + (m.status === 'Ativo' ? 'verde' : 'cinza') + '">' + esc(m.status) + '</span></div>';
    if (pend) h += '<div class="alerta-ouro">Já existe um pedido aguardando o síndico (' + esc(pend.tipo) + '). Enviar de novo substitui o pedido.</div>';
  } else {
    h += '<label class="ges-campo"><span class="rotulo">Nome</span><input type="text" id="eqNome" maxlength="80" placeholder="Nome e sobrenome" value="' + esc(f.nome) + '"></label>' +

function adicionarLinhas(txt, daFoto) {

    if (nova && nova.categoria && faixaAtiva() && nova.categoria !== S.cat) { S.cat = nova.categoria; guardarLocal('catLista', nova.categoria); }
    if (nova && podeCompartilhar(nova.condo) && !(infoCat && infoCat.unidade)) {
      S.ultimaCriada = nova;
      avisar(rotCriada, false, { rotulo: 'Compartilhar', seg: 7, fn: function () { compartilharCriada(); } });
    } else avisar(rotCriada);

function ligarMicrofone(bt, campo) {
  var Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  bt.addEventListener('click', function () {
    if (rec) { rec.stop(); return; }
    rec = new Rec();
    rec.lang = 'pt-BR'; rec.interimResults = true; rec.maxAlternatives = 1;
    var base = campo.value ? campo.value.trim() + ' ' : '';
    bt.classList.add('ouvindo'); bt.setAttribute('aria-label', 'Parar de ditar');
    rec.onresult = function (e) {
      var txt = '';
      for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      campo.value = (base + txt).slice(0, 120);
    };
    rec.onend = rec.onerror = function () {
      bt.classList.remove('ouvindo'); bt.setAttribute('aria-label', 'Ditar o título'); rec = null;
    };
    rec.start();
  });
}

var EVO_PESO_PRIO = { 'Alta': 0, 'Média': 1, 'Baixa': 2 };

function evoItem(id) { return E.todos.filter(function (s) { return s.id === id; })[0] || null; }
function mudancaEvolucao(ev) {
  var el = ev.target; if (!E || !el) return;
  if (el.hasAttribute('data-evoresp')) { E.resp = el.value; E.aberto = null; E.modo = null; desenharEvolucao(); return; }

    var s = evoItem(el.getAttribute('data-evomover')), etapa = el.value;

      if (r.ignorado) return;
      avisar('Movida para ' + etapa);
      s.etapa = r.etapa || etapa; s.status = r.status || s.status; s.responsavel = r.responsavel || s.responsavel;
      // a sugestão some desta aba: a tela segue a sugestão para a etapa nova
      E.grupo = evoGrupoDe(s.etapa); E.etapa = s.etapa;

}
function cliqueEvolucao(ev) {
  var b = ev.target.closest('button'); if (!b || !E) return;
  if (b.hasAttribute('data-evogrupo')) { E.grupo = b.getAttribute('data-evogrupo'); E.aberto = null; E.modo = null; desenharEvolucao(); return; }
  if (b.hasAttribute('data-evoetapa')) { E.etapa = b.getAttribute('data-evoetapa'); E.grupo = evoGrupoDe(E.etapa); E.aberto = null; E.modo = null; desenharEvolucao(); return; }
  if (b.hasAttribute('data-evoabrir')) { var id = b.getAttribute('data-evoabrir'); E.aberto = E.aberto === id ? null : id; E.modo = null; desenharEvolucao(); return; }
  if (b.hasAttribute('data-evocat')) { var sc = evoItem(E.aberto); if (sc) evoCategoriaFolha(sc); return; }
  if (b.hasAttribute('data-evoprio')) {
    var sp = evoItem(E.aberto); if (!sp) return;
    var nova = b.getAttribute('data-evoprio'); if (sp.prioridade === nova) nova = '';
    api('evolucao.prioridade', { id: sp.id, prioridade: nova }).then(function (r) {
      if (!r.ok) { avisar(r.mensagem, true); return; }
      if (r.ignorado) return;
      sp.prioridade = r.prioridade;
      avisar(r.prioridade ? 'Prioridade ' + r.prioridade.toLowerCase() : 'Prioridade retirada');
      setTimeout(function () { if (E && E.aberto === sp.id && !E.modo) desenharEvolucao(); }, 700); // depois do ✓ do botão
    });
    return;
  }
  var a = b.getAttribute('data-evo'); if (!a) return;
  if (a === 'cancelar') { E.modo = null; desenharEvolucao(); return; }
  if (a !== 'confirmar') { E.modo = a; desenharEvolucao(); return; }
  var s = evoItem(E.aberto); if (!s || E.ocupado) return;
  var txt = $('evoTxt') ? $('evoTxt').value.trim() : '';
  var m = E.modo, chamada;
  if (m === 'aprovar' || m === 'planejar' || m === 'recusar' || m === 'jaexiste') chamada = api('evolucao.decidir', { id: s.id, decisao: m, mensagem: txt, categoria: (m === 'aprovar' || m === 'planejar') ? (s._catSel || '') : '' });
  else if (m === 'perguntar') { if (!txt) { avisar('Escreva a pergunta.', true); return; } chamada = api('evolucao.perguntar', { id: s.id, pergunta: txt }); }
  else if (m === 'conversar') { if (!txt) { avisar('Escreva o que o agente deve considerar.', true); return; } chamada = api('evolucao.pedirAgente', { id: s.id, tipo: 'conversar', texto: txt }); }
  else if (m === 'implementar') chamada = api('evolucao.pedirAgente', { id: s.id, tipo: 'implementar', texto: txt });
  else if (m === 'noAr') chamada = api('evolucao.noAr', { id: s.id });
  E.ocupado = true;
  chamada.then(function (r) {
    E.ocupado = false;
    if (!r.ok) { avisar(r.mensagem, true); return; }
    if (r.ignorado) return;
    var msg = { aprovar: 'Sugestão aprovada', planejar: 'Sugestão planejada', recusar: 'Sugestão recusada', jaexiste: 'Marcada como já existe', perguntar: 'Pergunta enviada',
      conversar: 'Pedido enviado ao agente', implementar: 'Pedido enviado ao agente', noAr: 'Marcada como no ar' }[m];
    if (r.avisado) msg += ' · ' + primeiro(s.autorNome) + ' foi avisado';
    avisar(msg);
    E.modo = null; E.aberto = null;
    carregarEvolucao();
  }, function () { E.ocupado = false; });
}

/* ================= Camadas (janelas, menus, avisos) ================= */

function escFecha(e) { if (e.key === 'Escape') { if (RS_AP && RS_AP.salvando) return; // v1.32: apagando, a camada fica

    '<div class="jan-cab"><span class="alca" aria-hidden="true"></span><div><b>' + esc(titulo) + '</b><small>' + esc(sub) + '</small></div>' +

function abrirMenu(ancora, html, montar) {

var avisoTimer = null;

  return chamada.then(function (r) {

    var campo = b && b.closest('.pc-ap') && b.closest('.pc-ap').getAttribute('data-campo');

function pcCompAplica(p) {
  var c = p.mostrarSe; if (!c) return true;
  var C = PC.comp, v = C.valores[c.campo];
  if (v === undefined || v === null || String(v).trim() === '') return true;
  var a = parseFloat(String(v).replace(',', '.')), b = parseFloat(String(c.valor).replace(',', '.')), num = !isNaN(a) && !isNaN(b);
  switch (c.op) {
    case '=': return num ? a === b : norm(v) === norm(c.valor);
    case '!=': return num ? a !== b : norm(v) !== norm(c.valor);
    case '>': return num && a > b;
    case '<': return num && a < b;
    case '>=': return num && a >= b;
    case '<=': return num && a <= b;
  }
  return true;
}

/* ---------- Eventos do módulo ---------- */
function pcClique(e) {
  var b = e.target.closest('button, a[data-pc]');
  if (!b || b.disabled) return;
  if (b.hasAttribute('data-pc')) { e.preventDefault(); pcIr(b.getAttribute('data-pc')); return; }
  if (b.hasAttribute('data-pcir')) { var alvo = $(b.getAttribute('data-pcir')); if (alvo) alvo.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); return; }
  if (b.hasAttribute('data-pccopiar')) { var l = pcLinkAtivo(b.getAttribute('data-pccopiar')); if (l) copiarTexto(l.url, 'Link copiado'); return; }
  if (b.hasAttribute('data-pcsalvar')) { pcCompSalvar(b.getAttribute('data-pcsalvar')); return; }
  var a = b.getAttribute('data-pcacao'), C = PC.comp;
  switch (a) {
    case 'aprovar': case 'recusar': case 'comoNota': if (b.getAttribute('data-ids')) pcDecidir(a, b.getAttribute('data-ids'), b); break;
    case 'semConflito': pcDecidir('semConflito', '', b); break;
    case 'gerarLink': pcGerarLink(b.getAttribute('data-pub'), false); break;
    case 'novoLink':
      var pub = b.getAttribute('data-pub');
      pcConfirmar('Gerar link novo?', PC_PUB[pub].nome + ' · ' + PC.cond.condominio.nome, 'O link atual deixa de funcionar na hora. Quem abrir o antigo verá a tela de link inativo, com o botão para falar com você.', 'Gerar link novo',
        function () { return pcGerarLink(pub, true); });
      break;
    case 'desativar':
      var idL = b.getAttribute('data-id'), pubD = b.getAttribute('data-pub');
      pcConfirmar('Desativar o link?', PC_PUB[pubD].nome + ' · ' + PC.cond.condominio.nome, 'O link para de funcionar na hora. As respostas que já chegaram continuam aqui.', 'Desativar',
        function () {
          return api('perfil.desativarLink', { id: idL }).then(function (r) {
            if (r.ignorado) return r;
            if (!r.ok) { pcErro(r); return r; }
            avisar('Link desativado'); pcAtualizarN(); pcCondo(PC.cond.condominio.codigo, true); return r;
          });
        });
      break;
    case 'compSalvar': var cp = $('pcResp'); if (cp) pcCompSalvar(cp.value); break;
    case 'compPular': if (C) { C.pulados[C.id] = 1; pcCompPassar(C.id); } break;
    case 'compVoltar':
      if (C) { var L = pcCompLista(), i = L.indexOf(C.perguntas.filter(function (x) { return x.id === C.id; })[0]); var ant = L.slice(0, Math.max(0, i)).filter(function (p) { return !C.feitos[p.id]; }).pop(); if (ant) { C.id = ant.id; pcDesComp(); } }
      break;
    case 'compDeNovo': if (C) { C.pulados = {}; C.fim = false; pcCompPassar(null); } break;
    case 'novoSalvar': pcNovoSalvar(b.getAttribute('data-depois')); break;
    case 'recarregar':
      api('perfil.recarregar').then(function (r) { if (r.ignorado) return; if (!r.ok) { pcErro(r); return; } PC.lista = r; avisar('Perguntas recarregadas da planilha'); pcPerguntas(); });
      break;
    case 'config': abrirConfiguracoes('perfil'); break;
  }
}

      h += '<div class="rs-bat-card neutro' + (st === 'ok' ? ' ok' : '') + '"><div class="lin"><b>' + esc(g.credito.condominio + ' · ' + rsBatDia(g.credito.data)) + '</b><span class="vl">' + esc(rsMoeda(g.credito.valor)) + '</span></div>' +
        '<span class="cartao-meta">' + esc(g.credito.pagador) + '</span>' +
        (sug ? '<span style="font-size:.875em;line-height:1.5;color:var(--suave2)">Bate com lançamentos já concluídos sem data de recebimento:</span>' + rsBatLinhas(sug) : '<span style="font-size:.875em;color:var(--suave2)">Não bate com nada enviado nem com a soma de lançamentos.</span>') +
        (st ? '<span class="rs-selo ' + (st === 'ok' ? 'verde' : 'azul') + '" style="align-self:flex-start">' + (st === 'ok' ? 'Recebimento registrado' : 'Ignorado') + '</span>'
          : '<div class="rs-bat-acoes">' + (sug ? '<button class="bt" data-rs="batSug" data-rsk="' + k + '">Registrar recebimento</button>' : '') +
            '<button class="bt claro" data-rs="batIgnorar" data-rsk="' + k + '">Não é ressarcimento</button></div>') + '</div>';
    });
    h += '</div></section>';
  }
  var mais = r.jaBaixados.map(function (g) { return { c: g.credito, t: 'já baixado (' + g.itens.map(function (x) { return x.numDoc || x.descricao; }).join(', ') + ')' }; })
    .concat(r.antes.map(function (g) { return { c: g.credito, t: 'antes dos envios em aberto' }; }));
  if (mais.length) h += '<details class="rs-bat-mais"><summary>' + mais.length + (mais.length === 1 ? ' crédito que não entra' : ' créditos que não entram') + ' no batimento</summary><ul>' +
    mais.map(function (m) { return '<li><span>' + esc(rsBatDia(m.c.data) + ' · ' + m.c.condominio + ' · ' + m.t) + '</span><span>' + esc(rsMoeda(m.c.valor)) + '</span></li>'; }).join('') + '</ul></details>';
  if (!r.bateu.length && !r.somas.length && !r.escolher.length && !r.semNota.length) h += '<p class="vazio">Nenhum crédito novo para baixar neste extrato.</p>';
  return h + '<div class="rs-info">Regra: mesmo condomínio (pelo CNPJ do PIX), mesmo valor e crédito no dia do envio ou depois. PIX de pessoas e débitos ficam de fora.</div>';
}

function carregarScriptGoogle() {
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.defer = true;
  document.head.appendChild(s);
}
function iniciar() {
  try {
    var qsC = new URLSearchParams(location.search);
    if (qsC.get('compartilhado')) { guardar('compartilhado', '1'); history.replaceState(null, '', location.pathname); }
    if (/^CAT-\d+$/.test(qsC.get('c') || '')) S.catUrl = qsC.get('c'); // v1.23: ?c= abre a categoria
  } catch (e) {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js?v=3', { scope: './' }).catch(function () {});
  lerConviteUrl();
  guardarLinkDireto();
  S.sessao = ler('sessao');
  try { S.google = JSON.parse(ler('google') || 'null'); } catch (e) { S.google = null; }
  if (S.sessao) {
    $('entradaTexto').textContent = 'Abrindo…';
    recarregar(); // a casca abre assim que o portal e as tarefas chegam
  }
  chamar({ fn: 'config' }).then(function (c) {
    if (!c.ok || !c.clientId) { if (!S.sessao) mostrarEntrada(c.mensagem || 'Não foi possível carregar o aplicativo. Tente de novo em instantes.'); return; }
    S.cfg = c;
    carregarScriptGoogle();
    verificarPush();
    if (!S.sessao) mostrarEntrada();
  });
}
iniciar();
})();
</script>
